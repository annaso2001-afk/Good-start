<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Start — Учим английский</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* === СЛОВА: карточки и алфавит === */
.words-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
}

.words-search {
    flex: 1; min-width: 200px;
    padding: 10px 15px;
    border: 3px solid #E0F2FC;
    border-radius: 15px;
    font-family: inherit; font-size: 0.95rem;
    outline: none;
    transition: border 0.2s;
}
.words-search:focus { border-color: #4FA8D8; }

.alphabet-bar {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 20px;
    padding: 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 15px;
    position: sticky; top: 0; z-index: 10;
}

.alphabet-letter {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: #FFF;
    border: 2px solid #E0F2FC;
    border-radius: 8px;
    font-family: inherit; font-size: 0.85rem; font-weight: bold;
    color: #6A6A6A; cursor: pointer;
    transition: all 0.15s;
}
.alphabet-letter:hover {
    background: #E0F2FC; border-color: #7FC4E8; color: #2E7BAE;
}
.alphabet-letter.active {
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
    color: #FFF; border-color: #4FA8D8;
}
.alphabet-letter.disabled {
    opacity: 0.3; cursor: default; pointer-events: none;
}

.words-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 15px;
}

.word-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #E8F6FE 100%);
    border: 3px solid #FFF;
    border-radius: 18px;
    padding: 15px;
    box-shadow: 0 6px 18px rgba(79,168,216,0.15);
    transition: all 0.25s;
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
}
.word-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(79,168,216,0.3);
    border-color: #FFB073;
}

.word-card-emoji {
    font-size: 2.5rem;
    text-align: center;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.15));
    line-height: 1;
}

.word-card-en {
    font-size: 1.15rem; font-weight: bold;
    color: #2E7BAE;
    text-align: center;
    word-break: break-word;
}

.word-card-ru {
    font-size: 0.95rem;
    color: #E06A1E;
    text-align: center;
    font-weight: bold;
}

.word-card-actions {
    display: flex; justify-content: center; gap: 8px;
    margin-top: 4px;
}

.word-card-actions button {
    background: none; border: none; cursor: pointer;
    font-size: 1.2rem; padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.15s;
}
.word-card-actions button:hover {
    background: rgba(79,168,216,0.18);
    transform: scale(1.15);
}
.word-card-actions button.speaking {
    background: #FFE9B8;
    animation: pulse 0.8s infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

.word-card.letter-anchor {
    scroll-margin-top: 80px;
}

.letter-group-title {
    grid-column: 1 / -1;
    font-size: 1.5rem;
    font-weight: bold;
    color: #FF8C42;
    padding: 15px 0 5px;
    border-bottom: 2px dashed #FFD6A8;
    margin-top: 10px;
    scroll-margin-top: 80px;
}

.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 1rem;
}
   * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif; }

html {
    font-size: 20px; /* было 16px (по умолчанию) — стало крупнее на 25% */
}
    body {
        background: linear-gradient(135deg, #7FC4E8 0%, #FFD6A8 50%, #FFE9B8 100%);
        background-attachment: fixed;
        min-height: 100vh;
        padding: 20px;
        color: #3A3A3A;
    }

    header { text-align: center; margin-bottom: 25px; }

    h1 {
        font-size: 2.6rem;
        color: #FF8C42;
        text-shadow: 3px 3px 0 #FFF, 6px 6px 14px rgba(79,168,216,0.4);
        margin-bottom: 8px;
        letter-spacing: 1px;
    }

    .subtitle { color: #4A4A4A; font-size: 1.05rem; font-weight: bold; }

    .main-menu {
        display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
        margin-bottom: 25px; max-width: 1200px; margin: 0 auto 25px;
    }

    .menu-card {
        width: 175px; padding: 20px 12px;
        background: rgba(255,255,255,0.95);
        border: 4px solid #FFF; border-radius: 22px;
        box-shadow: 0 10px 25px rgba(79,168,216,0.25);
        cursor: pointer; transition: all 0.3s; text-align: center;
    }

    .menu-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 35px rgba(79,168,216,0.4);
        border-color: #FFB073;
    }

    .menu-card.active {
        background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
        color: #FFF;
        transform: scale(1.05);
        border-color: #FFB073;
        box-shadow: 0 12px 30px rgba(79,168,216,0.5);
    }

    .menu-card .icon { font-size: 2.8rem; margin-bottom: 6px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.18)); }
    .menu-card .title { font-size: 1.05rem; font-weight: bold; margin-bottom: 4px; line-height: 1.2; }
    .menu-card .desc { font-size: 0.72rem; color: #7A7A7A; line-height: 1.3; }
    .menu-card.active .desc { color: rgba(255,255,255,0.95); }

    .content {
        max-width: 1200px; margin: 0 auto;
        background: rgba(255,255,255,0.75);
        border-radius: 25px; padding: 30px 25px;
        min-height: 400px;
        border: 4px dashed rgba(255,255,255,1);
        box-shadow: 0 15px 40px rgba(79,168,216,0.2);
    }

    .placeholder { text-align: center; color: #999; font-size: 1.1rem; padding: 60px 20px; }
    .placeholder .big-icon { font-size: 4rem; display: block; margin-bottom: 15px; opacity: 0.65; }
    .placeholder h2 { font-size: 1.7rem; color: #FF8C42; margin-bottom: 10px; }
    .placeholder p { max-width: 500px; margin: 0 auto; line-height: 1.5; color: #6A6A6A; }

    .books-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;
    }

    .book-card {
        background: linear-gradient(135deg, #FFFFFF 0%, #E0F2FC 100%);
        border: 4px solid #FFF; border-radius: 20px;
        padding: 20px 15px; text-align: center; cursor: pointer;
        box-shadow: 0 8px 20px rgba(79,168,216,0.2);
        transition: all 0.3s;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
    }

    .book-card:hover {
        transform: translateY(-6px) scale(1.03);
        box-shadow: 0 14px 30px rgba(79,168,216,0.35);
        border-color: #FFB073;
    }

    .book-cover { font-size: 3.5rem; filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.18)); }
    .book-title { font-size: 1.05rem; font-weight: bold; color: #2E7BAE; line-height: 1.2; }
    .book-author { font-size: 0.85rem; color: #7A7A7A; }
    .book-level {
        font-size: 0.7rem; color: #E06A1E;
        background: rgba(255,140,66,0.18);
        padding: 3px 10px; border-radius: 10px; font-weight: bold;
    }

    .book-reader { display: flex; gap: 20px; min-height: 500px; }

    .book-text-area {
        flex: 1;
        background: rgba(255,255,255,0.95);
        border-radius: 20px; padding: 25px;
        border: 4px solid #FFF;
        box-shadow: 0 8px 20px rgba(79,168,216,0.2);
        max-height: 700px; overflow-y: auto;
    }

    .reader-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }

    .reader-title { font-size: 1.3rem; color: #2E7BAE; font-weight: bold; }

    .back-btn {
        padding: 8px 16px; border: 3px solid #FFF; border-radius: 18px;
        background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
        color: #FFF; cursor: pointer;
        font-family: inherit; font-weight: bold; font-size: 0.9rem;
        box-shadow: 0 4px 10px rgba(79,168,216,0.3); transition: all 0.2s;
    }

    .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(79,168,216,0.45);
        background: linear-gradient(135deg, #2E7BAE 0%, #4FA8D8 100%);
    }

    .chapter-nav {
        display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
        padding-bottom: 15px; border-bottom: 2px solid #E0F2FC;
    }

    .chapter-btn {
        padding: 6px 14px; border: 2px solid #E0F2FC; border-radius: 15px;
        background: #FFF; cursor: pointer; font-family: inherit;
        font-size: 0.85rem; color: #6A6A6A; transition: all 0.2s;
    }

    .chapter-btn:hover { background: #E0F2FC; border-color: #7FC4E8; }
    .chapter-btn.active {
        background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
        color: #FFF; border-color: #4FA8D8;
    }

    .book-text { font-size: 1.35rem; line-height: 1.9; color: #3A3A3A; }
    .book-text p { margin-bottom: 15px; }

    .book-text .word {
        cursor: pointer; padding: 1px 2px; border-radius: 4px;
        transition: background 0.4s, color 0.4s;
        display: inline-block;
    }

    .book-text .word:hover { background: rgba(79,168,216,0.22); }
    .book-text .word.selected {
        background: #FFE9B8;
        color: #E06A1E;
        font-weight: bold;
    }

    .book-text .word.fade-out {
        background: transparent !important;
        color: inherit !important;
        font-weight: normal !important;
    }

    .chapter-notes {
        margin-top: 25px; padding: 18px 20px;
        background: rgba(255,233,184,0.7);
        border-left: 5px solid #FF8C42;
        border-radius: 12px;
        font-size: 0.95rem; line-height: 1.9; color: #555;
    }
    .chapter-notes h3 {
        font-size: 1.05rem; color: #E06A1E; margin-bottom: 10px;
    }
    .chapter-notes .note-line { margin-bottom: 6px; }
    .chapter-notes .exercise { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #FF8C42; }
    .chapter-notes .exercise-title { font-weight: bold; color: #2E7BAE; margin-bottom: 6px; }

    .chapter-notes .gap-input {
        display: inline-block;
        min-width: 90px;
        max-width: 220px;
        padding: 2px 8px;
        margin: 0 4px;
        border: none;
        border-bottom: 2px dashed #FF8C42;
        background: rgba(255,255,255,0.85);
        font-family: inherit;
        font-size: 0.95rem;
        color: #2E7BAE;
        font-weight: bold;
        outline: none;
        text-align: center;
        transition: all 0.2s;
        border-radius: 4px 4px 0 0;
    }

    .chapter-notes .gap-input:focus {
        background: #FFE9B8;
        border-bottom-color: #4FA8D8;
    }

    .chapter-notes .exercise-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .chapter-notes .exercise-actions button {
        padding: 6px 14px;
        border: 2px solid #FFF;
        border-radius: 12px;
        background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
        color: #FFF;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(79,168,216,0.3);
        transition: all 0.2s;
    }

    .chapter-notes .exercise-actions button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(79,168,216,0.45);
        background: linear-gradient(135deg, #2E7BAE 0%, #4FA8D8 100%);
    }

    .chapter-notes .exercise-actions .reset-btn {
        background: linear-gradient(135deg, #B0B0B0 0%, #C8C8C8 100%);
    }
    .chapter-notes .exercise-actions .reset-btn:hover {
        background: linear-gradient(135deg, #8A8A8A 0%, #A8A8A8 100%);
    }

    .word-tooltip {
        position: fixed;
        background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
        color: #FFF;
        padding: 6px 14px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: bold;
        box-shadow: 0 6px 20px rgba(79,168,216,0.5);
        z-index: 300;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        white-space: nowrap;
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 2px solid #FFF;
    }

    .word-tooltip.visible { opacity: 1; }

    .word-tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top-color: #4FA8D8;
    }

    .word-tooltip.loading {
        background: linear-gradient(135deg, #AAA 0%, #CCC 100%);
    }

    .word-tooltip.loading::after { border-top-color: #AAA; }

    .sidebar {
        width: 0; overflow: hidden;
        background: rgba(255,255,255,0.98);
        border-radius: 20px; border: 4px solid #FFF;
        box-shadow: 0 8px 20px rgba(79,168,216,0.25);
        transition: width 0.3s, padding 0.3s;
        padding: 0; display: flex; flex-direction: column;
    }

    .sidebar.open { width: 360px; padding: 20px 15px; }

    .sidebar-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 15px; padding-bottom: 10px;
        border-bottom: 2px solid #E0F2FC;
    }

    .sidebar-title { font-size: 1.1rem; color: #E06A1E; font-weight: bold; }

    .sidebar-close {
        background: none; border: none; font-size: 1.5rem;
        cursor: pointer; color: #999; padding: 0 5px;
    }
    .sidebar-close:hover { color: #FF8C42; }

    .sidebar-list { flex: 1; overflow-y: auto; max-height: 600px; padding-right: 5px; }

    .dict-word {
        background: linear-gradient(135deg, #FFFFFF 0%, #E8F6FE 100%);
        border: 2px solid #E0F2FC; border-radius: 12px;
        padding: 12px; margin-bottom: 10px;
        display: flex; flex-direction: column; gap: 8px;
    }

    .dict-word-header {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }

    .dict-word-en { font-weight: bold; color: #2E7BAE; font-size: 1.15rem; word-break: break-word; }

    .dict-word-actions { display: flex; gap: 3px; }

    .dict-word-actions button {
        background: none; border: none; cursor: pointer;
        font-size: 0.95rem; padding: 3px; transition: transform 0.2s, background 0.2s;
        border-radius: 5px;
    }
    .dict-word-actions button:hover {
        transform: scale(1.2);
        background: rgba(79,168,216,0.18);
    }

    .dict-word-translation {
        font-size: 0.95rem; color: #555;
        padding: 8px 12px;
        background: rgba(79,168,216,0.12);
        border-radius: 8px; min-height: 32px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px;
    }

    .dict-word-translation .loading-translation {
        color: #AAA; font-size: 0.85rem; font-style: italic;
    }

    .dict-word-translation .translation-text {
        color: #E06A1E; font-weight: bold;
        font-size: 1rem;
    }

    .edit-area { display: flex; flex-direction: column; gap: 6px; }

    .edit-area input[type="text"] {
        padding: 8px 10px; border: 2px solid #E0F2FC;
        border-radius: 8px; font-family: inherit;
        font-size: 0.9rem; outline: none;
        transition: border 0.2s; width: 100%;
    }

    .edit-area input[type="text"]:focus { border-color: #4FA8D8; }

    .edit-area .edit-label { font-size: 0.75rem; color: #999; font-weight: bold; }

    .edit-area .edit-actions { display: flex; gap: 6px; }

    .edit-area button {
        padding: 6px 14px; border: none; border-radius: 8px;
        cursor: pointer; font-family: inherit;
        font-size: 0.85rem; font-weight: bold;
        transition: all 0.2s;
    }

    .edit-area .save-btn {
        background: linear-gradient(135deg, #FF8C42 0%, #FFB073 100%);
        color: #FFF;
    }
    .edit-area .save-btn:hover { background: linear-gradient(135deg, #E06A1E 0%, #FF8C42 100%); }

    .edit-area .cancel-btn { background: #EEE; color: #666; }
    .edit-area .cancel-btn:hover { background: #DDD; }

    .sidebar-empty {
        text-align: center; color: #AAA; font-size: 0.9rem;
        padding: 30px 15px; line-height: 1.5;
    }

    .sidebar-toggle {
        position: fixed; bottom: 25px; right: 25px;
        width: 65px; height: 65px; border-radius: 50%;
        background: linear-gradient(135deg, #FF8C42 0%, #FFB073 100%);
        border: 4px solid #FFF; color: #FFF; font-size: 1.6rem;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(255,140,66,0.5);
        z-index: 100; transition: all 0.2s;
        display: none; align-items: center; justify-content: center;
    }
    .sidebar-toggle.visible { display: flex; }
    .sidebar-toggle:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(255,140,66,0.65); }

    .dict-counter {
        position: absolute; top: -5px; right: -5px;
        background: #FFF; color: #E06A1E; border-radius: 50%;
        width: 24px; height: 24px; font-size: 0.8rem; font-weight: bold;
        display: flex; align-items: center; justify-content: center;
        border: 3px solid #FF8C42;
    }

    @media (max-width: 700px) {
        h1 { font-size: 1.8rem; }
        .subtitle { font-size: 0.9rem; }
        .menu-card { width: 130px; padding: 14px 8px; }
        .menu-card .icon { font-size: 2.2rem; }
        .menu-card .title { font-size: 0.8rem; }
        .menu-card .desc { font-size: 0.62rem; }
        .content { padding: 20px 15px; min-height: 300px; }
        .books-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .book-cover { font-size: 2.5rem; }
        .book-title { font-size: 0.9rem; }
        .book-reader { flex-direction: column; }
        .sidebar.open { width: 100%; }
        .book-text { font-size: 1.2rem; line-height: 1.7; }
        .chapter-notes .gap-input { min-width: 70px; max-width: 140px; }
    }

.game-card .game-icon {

.game-card .game-title {

.game-card .game-desc {

}

.games-back-btn {
    display: inline-block;
    padding: 10px 22px;
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
    color: #FFF;
    border: 3px solid #FFF;
    border-radius: 18px;
    font-family: inherit;
    font-weight: bold;

    box-shadow: 0 5px 15px rgba(79,168,216,0.3);

}

    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(79,168,216,0.45);
    background: linear-gradient(135deg, #2E7BAE 0%, #4FA8D8 100%);

.games-placeholder {
    text-align: center;
    color: #999;
    font-size: 1.1rem;
    padding: 60px 20px;
}
.games-placeholder .big-icon {
    font-size: 4rem;
    display: block;
    margin-bottom: 15px;
    opacity: 0.65;
}
.games-placeholder h2 {
    font-size: 1.7rem;
    color: #FF8C42;
    margin-bottom: 10px;
}
/* ============================================================
   ЭКРАН ВЫБОРА ПОЛЬЗОВАТЕЛЯ + КНОПКА ПРОФИЛЯ
   ============================================================ */
.user-picker-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #7FC4E8 0%, #FFD6A8 50%, #FFE9B8 100%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}
.user-picker-overlay h1 {
    font-size: 2.2rem;
    color: #FF8C42;
    text-shadow: 3px 3px 0 #FFF, 6px 6px 14px rgba(79,168,216,0.4);
    margin-bottom: 10px;
    text-align: center;
}
.user-picker-overlay .sub {
    font-size: 1.2rem;
    color: #4A4A4A;
    font-weight: bold;
    margin-bottom: 30px;
    text-align: center;
}

.user-picker-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    max-width: 900px;
}

.user-tile {
    width: 150px;
    height: 180px;
    background: rgba(255,255,255,0.95);
    border: 4px solid #FFF;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(79,168,216,0.25);
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    padding: 15px;
}
.user-tile:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 15px 35px rgba(79,168,216,0.45);
    border-color: #FFB073;
}
.user-tile .u-emoji {
    font-size: 3.5rem;
    line-height: 1;
} /* Фото-аватар на плитке */
.user-tile .u-photo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    border: 3px solid #FFF;
    box-shadow: 0 4px 12px rgba(79,168,216,0.3);
    background: #E0F2FC;
}

/* Фото в chip (маленькое) */
.user-chip .u-photo-small {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    border: 2px solid #FFF;
    vertical-align: middle;
}

/* Кнопка "Своё фото" в модалке */
.photo-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}
.photo-upload-btn {
    padding: 10px 18px;
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
    color: #FFF;
    border: 3px solid #FFF;
    border-radius: 15px;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(79,168,216,0.4);
    transition: all 0.2s;
}
.photo-upload-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(79,168,216,0.6);
}
.photo-preview {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    border: 3px solid #FFB073;
    background: #E0F2FC;
    display: none;
}
.photo-preview.visible {
    display: block;
}
.photo-remove-btn {
    background: #EEE;
    color: #666;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    display: none;
}
.photo-remove-btn.visible {
    display: inline-block;
}
.photo-remove-btn:hover {
    background: #DDD;
}
.user-tile .u-name {
    font-size: 1.05rem;
    font-weight: bold;
    color: #2E7BAE;
    text-align: center;
    word-break: break-word;
}
.user-tile.add-new {
    background: rgba(255,255,255,0.6);
    border-style: dashed;
    border-color: #7FC4E8;
}
.user-tile.add-new .u-emoji,
.user-tile.add-new .u-name { color: #4FA8D8; }

.user-tile .u-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #FFF;
    border: 2px solid #E0F2FC;
    color: #999;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    padding: 0;
}
.user-tile .u-delete:hover {
    background: #FFE9B8;
    border-color: #FF8C42;
    color: #E06A1E;
    transform: scale(1.1);
}

/* Кнопка смены пользователя в шапке */
.user-chip {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #FFF;
    border: 3px solid #FFF;
    border-radius: 22px;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(79,168,216,0.3);
    color: #2E7BAE;
    transition: all 0.2s;
}
.user-chip:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(79,168,216,0.45);
}

/* Модалка создания пользователя */
.user-modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.user-modal {
    background: #FFF;
    border-radius: 25px;
    padding: 30px;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.user-modal h2 {
    color: #2E7BAE;
    margin-bottom: 20px;
    font-size: 1.3rem;
}
.user-modal label {
    display: block;
    font-size: 0.9rem;
    color: #6A6A6A;
    font-weight: bold;
    margin-bottom: 6px;
}
.user-modal input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border: 3px solid #E0F2FC;
    border-radius: 15px;
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    margin-bottom: 18px;
    transition: border 0.2s;
    box-sizing: border-box;
}
.user-modal input[type="text"]:focus { border-color: #4FA8D8; }

.emoji-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
}
.emoji-choice {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #F5F5F5;
    border: 3px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    transition: all 0.15s;
    padding: 0;
}
.emoji-choice:hover { transform: scale(1.1); background: #E0F2FC; }
.emoji-choice.selected {
    background: #FFE9B8;
    border-color: #FF8C42;
}

.user-modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}
.user-modal-actions button {
    padding: 10px 22px;
    border: none;
    border-radius: 15px;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
}
.user-modal-actions .btn-cancel {
    background: #EEE;
    color: #666;
}
.user-modal-actions .btn-cancel:hover { background: #DDD; }
.user-modal-actions .btn-create {
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
    color: #FFF;
    box-shadow: 0 4px 12px rgba(79,168,216,0.4);
}
.user-modal-actions .btn-create:hover {
    background: linear-gradient(135deg, #2E7BAE 0%, #4FA8D8 100%);
    transform: translateY(-2px);
} 
/* === ИСПРАВЛЕНИЕ: кнопки звука и темы === */
.sound-toggle {
    position: fixed !important;
    bottom: 25px !important;
    right: 100px !important;
    width: 55px !important;
    height: 55px !important;
    border-radius: 50% !important;
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%) !important;
    border: 4px solid #FFF !important;
    color: #FFF !important;
    font-size: 1.4rem !important;
    cursor: pointer !important;
    box-shadow: 0 6px 20px rgba(79,168,216,0.5) !important;
    z-index: 100 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
.sound-toggle.muted {
    background: linear-gradient(135deg, #B0B0B0 0%, #C8C8C8 100%) !important;
}
.theme-toggle {
    position: fixed !important;
    bottom: 25px !important;
    right: 170px !important;
    width: 55px !important;
    height: 55px !important;
    border-radius: 50% !important;
    background: linear-gradient(135deg, #FF8C42 0%, #FFB073 100%) !important;
    border: 4px solid #FFF !important;
    color: #FFF !important;
    font-size: 1.4rem !important;
    cursor: pointer !important;
    box-shadow: 0 6px 20px rgba(255,140,66,0.5) !important;
    z-index: 100 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
body.dark-theme {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important;
    color: #e0e0e0 !important;
}
body.dark-theme .content {
    background: rgba(30, 30, 50, 0.85) !important;
}
body.dark-theme .menu-card,
body.dark-theme .book-card,
body.dark-theme .word-card,
body.dark-theme .game-card {
    background: linear-gradient(135deg, #1e2a45 0%, #2a3a5c 100%) !important;
    color: #e0e0e0 !important;
}
/* === ПОП-АП УНИВЕРСАЛЬНОГО ВЫДЕЛЕНИЯ === */
.global-word-popup {
    position: fixed;
    z-index: 5000;
    background: #FFF;
    border: 3px solid #FF8C42;
    border-radius: 15px;
    padding: 10px 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    font-family: inherit;
    font-size: 0.95rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
    max-width: 320px;
    animation: gwpAppear 0.18s ease;
    color: #3A3A3A;
}
@keyframes gwpAppear {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}
.global-word-popup .gwp-word {
    font-weight: bold;
    color: #2E7BAE;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.global-word-popup .gwp-lang {
    font-size: 0.7rem;
    color: #666;
    font-weight: normal;
    background: #F0F0F0;
    padding: 2px 7px;
    border-radius: 8px;
}
.global-word-popup .gwp-translation {
    color: #E06A1E;
    font-weight: bold;
    font-size: 1rem;
    min-height: 20px;
    word-break: break-word;
}
.global-word-popup .gwp-translation.loading {
    color: #AAA;
    font-style: italic;
    font-weight: normal;
    font-size: 0.9rem;
}
.global-word-popup .gwp-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    margin-top: 2px;
}
.global-word-popup .gwp-actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.15rem;
    padding: 4px 8px;
    border-radius: 8px;
    transition: all 0.15s;
    font-family: inherit;
}
.global-word-popup .gwp-actions button:hover {
    background: rgba(79,168,216,0.18);
    transform: scale(1.12);
}
.global-word-popup .gwp-actions button.saved {
    background: rgba(76,175,80,0.18);
}
body.dark-theme .global-word-popup {
    background: #1e2a45;
    border-color: #FFB073;
    color: #e0e0e0;
}
body.dark-theme .global-word-popup .gwp-lang {
    background: #2a3a5c;
    color: #aaa;
}
body.dark-theme .menu-card,
body.dark-theme .book-card,
body.dark-theme .word-card,
body.dark-theme .game-card {
    background: linear-gradient(135deg, #1e2a45 0%, #2a3a5c 100%) !important;
    color: #e0e0e0 !important;
}
/* === ИГРА: ФОРМЫ === */
.sg-levels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 700px;
    margin: 0 auto;
}
.sg-level-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #E8F6FE 100%);
    border: 4px solid #FFF;
    border-radius: 22px;
    padding: 24px 18px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(79,168,216,0.2);
    transition: all 0.25s;
    position: relative;
}
.sg-level-card:hover:not(.locked) {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(79,168,216,0.4);
    border-color: #FFB073;
}
.sg-level-card.locked {
    cursor: not-allowed;
    opacity: 0.65;
    background: linear-gradient(135deg, #F5F5F5 0%, #E0E0E0 100%);
}
.sg-level-card.done { border-color: #81C784; }
.sg-level-icon { font-size: 3rem; line-height: 1; margin-bottom: 10px; }
.sg-level-num {
    font-size: 0.75rem; font-weight: bold;
    color: #E06A1E; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px;
}
.sg-level-title {
    font-size: 1.15rem; font-weight: bold;
    color: #2E7BAE; margin-bottom: 6px;
}
.sg-level-desc {
    font-size: 0.85rem; color: #7A7A7A; margin-bottom: 10px;
}
.sg-level-badge {
    display: inline-block; padding: 4px 12px;
    border-radius: 12px; font-size: 0.75rem; font-weight: bold;
    background: rgba(76,175,80,0.15); color: #388E3C;
}
.sg-level-badge.unlocked {
    background: rgba(79,168,216,0.15); color: #2E7BAE;
}
.sg-level-badge.locked-badge {
    background: rgba(120,120,120,0.15); color: #666;
}
.sg-shake { animation: sgShake 0.5s ease; }
@keyframes sgShake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-8px); }
    75%     { transform: translateX(8px); }
}

.sg-container { max-width: 640px; margin: 0 auto; }
.sg-prompt-card {
    background: linear-gradient(135deg, #FFFFFF 0%, #E8F6FE 100%);
    border: 4px solid #FFF;
    border-radius: 22px;
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(79,168,216,0.25);
    margin-bottom: 22px;
    animation: sgAppear 0.3s ease;
}
@keyframes sgAppear {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
}
.sg-svg-prompt {
    width: 170px; height: 170px;
    margin: 0 auto 14px;
}
.sg-emoji-prompt {
    font-size: 5rem; line-height: 1;
    margin-bottom: 6px;
    filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.15));
}
.sg-object-ru {
    font-size: 1.2rem; font-weight: bold;
    color: #E06A1E; margin-bottom: 10px;
}
.sg-question {
    font-size: 1rem; font-weight: bold;
    color: #2E7BAE; margin-top: 8px;
}
.sg-options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
}
@media (max-width: 500px) { .sg-options { grid-template-columns: 1fr; } }
.sg-option {
    padding: 16px 14px;
    background: #FFF;
    border: 3px solid #E0F2FC;
    border-radius: 15px;
    font-family: inherit; font-size: 1.1rem;
    font-weight: bold; color: #2E7BAE;
    cursor: pointer; text-align: center;
    transition: all 0.2s; word-break: break-word;
}
.sg-option:hover:not(:disabled) {
    border-color: #7FC4E8; background: #E0F2FC;
    transform: translateY(-3px);
}
.sg-option:disabled { cursor: default; }
.sg-option.correct {
    background: linear-gradient(135deg, #A8E6A3 0%, #C8F0C4 100%);
    border-color: #4CAF50; color: #1B5E20;
    transform: scale(1.04);
}
.sg-option.wrong {
    background: linear-gradient(135deg, #FFB3B3 0%, #FFD0D0 100%);
    border-color: #E53935; color: #B71C1C;
}

.sg-complete {
    text-align: center; padding: 30px 20px;
    background: linear-gradient(135deg, #FFFFFF 0%, #E8F6FE 100%);
    border: 4px solid #FFF; border-radius: 25px;
    box-shadow: 0 10px 25px rgba(79,168,216,0.25);
}
.sg-complete-emoji { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
.sg-complete h2 { color: #2E7BAE; margin-bottom: 10px; font-size: 1.5rem; }
.sg-complete-score {
    font-size: 1.6rem; color: #E06A1E;
    font-weight: bold; margin-bottom: 12px;
}
.sg-complete-status {
    display: inline-block; padding: 6px 16px;
    border-radius: 14px; font-weight: bold;
    font-size: 0.95rem; margin-bottom: 16px;
}
.sg-complete-status.passed {
    background: rgba(76,175,80,0.15); color: #388E3C;
}
.sg-complete-status.failed {
    background: rgba(229,57,53,0.12); color: #C62828;
}
.sg-unlock-banner {
    background: linear-gradient(135deg, #FFE9B8 0%, #FFD6A8 100%);
    color: #E06A1E;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 1rem;
    margin-bottom: 18px;
    box-shadow: 0 4px 12px rgba(255,140,66,0.3);
    animation: sgPulse 1.4s ease infinite;
}
@keyframes sgPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.02); }
}
.sg-complete-actions {
    display: flex; gap: 10px; justify-content: center;
    flex-wrap: wrap;
}
.sg-btn-primary, .sg-btn-secondary {
    padding: 12px 22px;
    border: 3px solid #FFF; border-radius: 18px;
    font-family: inherit; font-weight: bold; font-size: 0.95rem;
    cursor: pointer; transition: all 0.2s;
}
.sg-btn-primary {
    background: linear-gradient(135deg, #4FA8D8 0%, #7FC4E8 100%);
    color: #FFF; box-shadow: 0 5px 15px rgba(79,168,216,0.35);
}
.sg-btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(79,168,216,0.5);
}
.sg-btn-secondary {
    background: linear-gradient(135deg, #B0B0B0 0%, #C8C8C8 100%);
    color: #FFF; box-shadow: 0 5px 15px rgba(150,150,150,0.3);
}
.sg-btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 22px rgba(150,150,150,0.4);
}
/* === Иконки Font Awesome вместо эмодзи === */
.word-card-emoji i,
.fc-emoji i,
.ct-prompt-emoji i,
.bw-hint-emoji i,
.hm-hint-emoji i {
    font-size: 0.95em;
    color: #2E7BAE;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.15));
}
body.dark-theme .word-card-emoji i,
body.dark-theme .fc-emoji i {
    color: #B7E0F5;
}
/* === УРОВЕНЬ 1: АУДИРОВАНИЕ + SVG-ОПЦИИ === */
.sg-audio-prompt {
    text-align: center;
    padding: 15px 0;
}
.sg-play-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 36px;
    background: linear-gradient(135deg, #FF8C42 0%, #FFB073 100%);
    color: #FFF;
    border: 4px solid #FFF;
    border-radius: 22px;
    font-family: inherit;
    font-weight: bold;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,140,66,0.45);
    transition: all 0.2s;
}
.sg-play-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(255,140,66,0.6);
}
.sg-play-btn:active {
    transform: translateY(0);
    box-shadow: 0 5px 15px rgba(255,140,66,0.4);
}
.sg-options-svg {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
.sg-option-svg {
    padding: 15px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
}
.sg-option-svg svg {
    width: 100%;
    height: 100%;
    max-width: 130px;
    max-height: 130px;
}
/* === УРОВЕНЬ 3: ПРОЧИТАЙ И ВЫБЕРИ === */
.sg-word-prompt {
    font-size: 3rem;
    font-weight: bold;
    color: #2E7BAE;
    padding: 30px 10px;
    letter-spacing: 2px;
    word-break: break-word;
    text-shadow: 2px 2px 0 #FFF, 4px 4px 10px rgba(79,168,216,0.25);
}

/* === ГОЛОСОВОЙ ВВОД === */
.voice-toggle {
    position: fixed !important;
    bottom: 25px !important;
    right: 240px !important;
    width: 55px !important;
    height: 55px !important;
    border-radius: 50% !important;
    background: linear-gradient(135deg, #9C27B0 0%, #BA68C8 100%) !important;
    border: 4px solid #FFF !important;
    color: #FFF !important;
    font-size: 1.4rem !important;
    cursor: pointer !important;
    box-shadow: 0 6px 20px rgba(156,39,176,0.5) !important;
    z-index: 100 !important;
    display: flex !important;

function loadUsers() {

/**
 * Читает файл, рисует на canvas, сжимает до maxW×maxH,
 * возвращает data URL (JPEG, качество 0.85).
 */
function resizeImage(file, maxW, maxH) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
        reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Не удалось открыть картинку'));
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                const ratio = Math.min(maxW / w, maxH / h, 1);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                resolve(dataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function removeUser(id) {
    const users = loadUsers();
    if (users.length <= 1) return false;
    const prefix = 'u:' + id + ':';
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
    saveUsers(users.filter(u => u.id !== id));
    return true;
}

// ============================================================
// АВТО-ПРЕФИКС: localStorage сам добавляет имя пользователя
// ============================================================
(function patchLocalStorage() {
    const _setItem    = Storage.prototype.setItem;
    const _getItem    = Storage.prototype.getItem;
    const _removeItem = Storage.prototype.removeItem;

    // Сохраняем оригиналы для миграции
    Storage.prototype.setItem.__native__    = _setItem;
    Storage.prototype.getItem.__native__    = _getItem;
    Storage.prototype.removeItem.__native__ = _removeItem;

    const GLOBAL_KEYS = [
        'goodStart_theme',
        'goodStart_soundEnabled',
        'goodStart_users',
        'goodStart_activeUser',
        'goodStart_migrated_v1'
    ];

    function shouldPrefix(key) {
        if (typeof key !== 'string') return false;
        if (key.startsWith('u:')) return false;
        if (GLOBAL_KEYS.includes(key)) return false;
        if (key.startsWith('translation_')) return false;
        return true;
    }

    function prefixed(key) {
        if (!shouldPrefix(key)) return key;
        const active = getActiveUser();
        return 'u:' + active.id + ':' + key;
    }

    Storage.prototype.setItem = function(key, value) {
        return _setItem.call(this, prefixed(key), value);
    };
    Storage.prototype.getItem = function(key) {
        return _getItem.call(this, prefixed(key));
    };
    Storage.prototype.removeItem = function(key) {
        return _removeItem.call(this, prefixed(key));
    };
})();
// ============================================================
// МИГРАЦИЯ: старые ключи → профиль "default"
// ============================================================
(function migrateOldData() {
    // Оригинальные методы — сохраняем ДО перехвата
    const nativeSet = Storage.prototype.setItem.__native__ || Storage.prototype.setItem;
    const nativeGet = Storage.prototype.getItem.__native__ || Storage.prototype.getItem;
    const nativeRemove = Storage.prototype.removeItem.__native__ || Storage.prototype.removeItem;

    if (nativeGet.call(localStorage, MIGRATION_FLAG)) return;

    const keysToMigrate = ['goodStart_myDictionary', 'goodStart_learnedWords'];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k) continue;
        if (k.startsWith('u:')) continue;
        if (k.startsWith('translation_') || k.startsWith('ex_')) {
            keysToMigrate.push(k);
        }
    }

    keysToMigrate.forEach(k => {
        const v = nativeGet.call(localStorage, k);
        if (v === null) return;
        nativeSet.call(localStorage, 'u:default:' + k, v);
        nativeRemove.call(localStorage, k);
    });

    nativeSet.call(localStorage, MIGRATION_FLAG, '1');
})();

async function googleTranslate(text) {
    const url1 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
    try {
        const response = await fetch(url1);
        if (response.ok) {
            const data = await response.json();
            if (data && data[0] && Array.isArray(data[0])) {
                let translation = '';
                for (const part of data[0]) {
                    if (part && part[0]) translation += part[0];
                }
                translation = translation.trim();
                if (isValidTranslation(translation, text)) return translation;
            }
        }
    } catch (e) {
        console.warn('Google Translate endpoint 1 failed:', e);
    }

    const url2 = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ru&q=${encodeURIComponent(text)}`;
    try {
        const response = await fetch(url2);
        if (response.ok) {
            const data = await response.json();
            let translation = '';
            if (Array.isArray(data)) {
                if (typeof data[0] === 'string') translation = data[0];
                else if (data[0] && data[0][0]) translation = data[0][0];
            }
            translation = translation.trim();
            if (isValidTranslation(translation, text)) return translation;
        }
    } catch (e) {
        console.warn('Google Translate endpoint 2 failed:', e);
    }

    return null;
}

function isValidTranslation(translation, originalWord) {
    if (!translation || translation.length === 0) return false;
    if (translation === '—') return false;

    const t = translation.toLowerCase().trim();
    const w = originalWord.toLowerCase().trim().replace(/[’‘`´]/g, "'");

    const hasApostrophe = /['’‘`´]/.test(originalWord);
    if (hasApostrophe && !t.includes(' ') && t.length < 5) {
        const suspiciousContractions = ["don't", "doesn't", "didn't", "won't",
            "can't", "couldn't", "shouldn't", "mustn't", "isn't", "aren't",
            "wasn't", "weren't", "haven't", "hasn't", "hadn't"];
        if (suspiciousContractions.includes(w)) return false;
    }

    if (t === w && w.length < 3) return false;
    if (translation.length > w.length * 5 + 10) return false;
    if (/[^\u0400-\u04FF\u0041-\u007A\s\-.,!?()]/.test(translation)) return false;

    const badMarkers = ['рвот', 'тошн', 'понос', 'фекал', 'моч', 'сперм'];
    if (badMarkers.some(marker => t.includes(marker))) return false;

    if (w.split(' ').length === 1 && /^с\s/i.test(translation) && translation.split(' ').length === 2) {
        return false;
    }

    return true;
}

const translationCache = {};

// База фраз (заполняется ниже)
let phrasesData = [];

function findPhraseTranslation(text) {
    const textLower = text.toLowerCase().trim();
    const found = phrasesData.find(p => p.en.toLowerCase().trim() === textLower);
    return found ? found.ru : null;
}

// ============================================================
// ГЛАВНАЯ ФУНКЦИЯ ПЕРЕВОДА (исправленная, без дублирования)
// ============================================================
async function getTranslation(word) {
    const wordLower = word.toLowerCase().trim();

    // 0. Готовые фразы — самые точные
    const phraseTranslation = findPhraseTranslation(word);
    if (phraseTranslation) {
        translationCache[wordLower] = phraseTranslation;
        localStorage.setItem('translation_' + wordLower, phraseTranslation);
        return phraseTranslation;
    }

    // 1. Словарь сокращений
    const normalizedWord = wordLower.replace(/[’‘`´]/g, "'");
    if (contractionDictionary[normalizedWord]) {
        translationCache[wordLower] = contractionDictionary[normalizedWord];
        localStorage.setItem('translation_' + wordLower, contractionDictionary[normalizedWord]);
        return contractionDictionary[normalizedWord];
    }

    // 2. Кэш в памяти
    if (translationCache[wordLower] && isValidTranslation(translationCache[wordLower], wordLower)) {
        return translationCache[wordLower];
    }

    // 3. Кэш в localStorage
    const cached = localStorage.getItem('translation_' + wordLower);
    if (cached && isValidTranslation(cached, wordLower)) {
        translationCache[wordLower] = cached;
        return cached;
    } else if (cached) {
        localStorage.removeItem('translation_' + wordLower);
    }

    // 4. Google Translate
    let translation = await googleTranslate(word);
    if (!translation) translation = '—';

    translationCache[wordLower] = translation;
    localStorage.setItem('translation_' + wordLower, translation);
    return translation;
}

let britishVoice = null;

function findBritishVoice() {
    if (!('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    if (!voices.length) return null;

    const preferred = [
        'Google UK English Female', 'Google UK English Male',
        'Daniel', 'Kate', 'Serena', 'Oliver',
        'Microsoft Libby', 'Microsoft Ryan',
        'Microsoft Sonia', 'Microsoft Hazel'
    ];
    for (const name of preferred) {
        const v = voices.find(voice => voice.name.includes(name));
        if (v) return v;
    }
    const gb = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
    if (gb) return gb;
    return voices.find(v => v.lang.startsWith('en')) || null;
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { britishVoice = findBritishVoice(); };
    britishVoice = findBritishVoice();
    setTimeout(() => { britishVoice = findBritishVoice(); }, 300);
}

function speakWord(text, btn) {
    if (!soundEnabled) return;                                  // ← новая строка
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!britishVoice) britishVoice = findBritishVoice();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-GB';
    utterance.rate = 0.75;
    utterance.pitch = 1.0;
    if (britishVoice) utterance.voice = britishVoice;

    if (btn) {
        btn.classList.add('speaking');
        utterance.onend = () => btn.classList.remove('speaking');
        utterance.onerror = () => btn.classList.remove('speaking');
    }
    window.speechSynthesis.speak(utterance);
}

let tooltipEl = null;
let tooltipWord = null;

function createTooltip() {
    if (tooltipEl) return;
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    tooltipEl.id = 'word-tooltip';
    document.body.appendChild(tooltipEl);
}

async function showTooltip(wordEl, word) {
    createTooltip();

    const rect = wordEl.getBoundingClientRect();
    tooltipEl.style.left = (rect.left + rect.width / 2) + 'px';
    tooltipEl.style.top = (rect.top - 40) + 'px';
    tooltipEl.style.transform = 'translateX(-50%)';
    tooltipEl.classList.add('visible');

    const wordLower = word.toLowerCase().trim();

    if (translationCache[wordLower] && isValidTranslation(translationCache[wordLower], wordLower)) {
        tooltipEl.textContent = translationCache[wordLower];
        tooltipEl.classList.remove('loading');
        return;
    }

    const cached = localStorage.getItem('translation_' + wordLower);
    if (cached && isValidTranslation(cached, wordLower)) {
        translationCache[wordLower] = cached;
        tooltipEl.textContent = cached;
        tooltipEl.classList.remove('loading');
        return;
    }

    tooltipEl.textContent = '⏳ загрузка...';
    tooltipEl.classList.add('loading');

    const translation = await getTranslation(word);
    if (tooltipWord === wordEl) {
        tooltipEl.textContent = translation;
        tooltipEl.classList.remove('loading');
    }
}

function hideTooltip() {
    if (tooltipEl) tooltipEl.classList.remove('visible');
    tooltipWord = null;
}

"I always sleep with the knife by me," said the little robber-girl. "No one knows what may happen. But now tell me again all about Kay." She put one arm across Gerda's neck and held the knife in the other. Soon she was fast asleep. But Gerda could not close her eyes — she did not know if she will live or die. The robbers sat round the fire singing and drinking.`,

            {
                title: "Story 6",
                text: `Then the pigeons said, "Coo, coo, we saw little Kay. He sat in the carriage of the Snow Queen which drove through the wood while we were lying in our nest. She blew upon us and all the young birds died except us two. Coo, coo."

"What are you saying there?" cried the robber-girl. "Do you know where the Snow Queen was going?"

"She was going to Lapland where there is always snow and ice. Ask the reindeer."

"Yes, there is always snow and ice there," said the reindeer. "And it is a wonderful place: you can run freely on the sparkling ice. The Snow Queen has her summer cottage there but her palace is at the North Pole."

"Do you know where Lapland is?" asked the robber-girl.

"Who can know better than I?" said the reindeer. "I was born and brought up there and ran on the snow-covered plains!"

At noon when all the robbers went away and only the robber-girl's mother stayed at home, but she was drunk and was fast asleep, the little robber-girl went up to the reindeer and said, "I'll let you free and you'll run away to Lapland. But you must carry this little girl to the palace of the Snow Queen where her friend is." The reindeer laughed for joy, and the robber-girl lifted Gerda on his back and even gave her a cushion to sit on.

"Here are your fur boots and your coat," she said, "because it will be very cold but I'll keep your muff — it is so pretty. But I'll give you my mother's large warm mittens. Let me put them on your hands. And here are two loaves of bread and a ham, so you won't be hungry." And with these words she opened the door and cut the rope, with which the reindeer was tied, with her knife. "Now run and take good care of this girl," she told the reindeer.

And Gerda stretched out her hand in a big mitten toward the reindeer and said farewell.`,

            {
                title: "Story 7",
                text: `They stopped at a little hut. There was nobody at home except an old Lapland woman who was cooking fish. The reindeer told her Gerda's story. "Oh, you poor things," said the Lapland woman, "you have a long way to go yet. You must travel more than a hundred miles to Finland. The Snow Queen lives there now, and she burns Bengal lights every evening. I'll write a few words on a dried fish as I have no paper, and you can take it from me to the Finland woman who lives there. She can give you more information than I can."

So when Gerda got warmed and had something to eat and drink, the woman wrote a few words on a dried fish and then tied Gerda on the reindeer. After some time they reached Finland and knocked at the Finland woman's hut. It was so hot inside that the woman wore almost no clothes. She took off Gerda's fur boots and the mittens and put a piece of ice on the reindeer's head. After she read what was written on the dried fish three times she put the fish into her pocket.

Then the Finland woman said, "Gerda must defeat the Snow Queen herself. Her power is in her heart. She is a sweet and innocent child. If she cannot enter the Snow Queen's palace and remove the pieces of glass from Kay's heart and eye, then we shall never see him again. Two miles from here the Snow Queen's garden begins. You can carry the girl there, and put her down by the large bush with red berries, standing in the snow. Don't stay there talking but come back here at once."

So the reindeer put Gerda down by the large bush with red berries and then ran back as fast as he could. Poor Gerda stood in the middle of cold, ice-covered Finland without her boots and mittens.

Then she ran forward as fast as she could. A whole legion of snowflakes came round her. They did not fall from the sky, they ran along the ground and the nearer they came to her, the larger they became. They were alive and they were the guards of the Snow Queen.

Little Gerda began to say a prayer and the cold was so great that she could see steam coming out of her mouth. The steam increased as she continued the prayer till it took the shape of little angels who grew larger at the moment they touched the ground. Their number increased more and more, and by the time Gerda finished her prayers a whole legion of angels with spears stood round her. They killed the terrible snowflakes with their spears and little Gerda could go forward with safety. The angels stroked her hands and feet so that she felt the cold less and she ran to the Snow Queen's palace.`,

            {
                title: "Story 8",
                text: `But now we must see what little Kay is doing. To tell the truth, he did not think of Gerda and could not suppose that she was standing in front of the palace. The walls of the palace were formed of snow and its windows and doors of the winds. There were more than a hundred rooms in it and they were so large and empty, so icy cold and sparkling! The flame of the northern lights could be seen from every part of the palace. In the middle of its empty hall of snow was a frozen lake and in the centre of this lake sat the Snow Queen when she was at home.

Little Kay was quite blue, almost black with cold, but he did not feel it for the Snow Queen kissed him and his heart was already a piece of ice. He was moving some pieces of ice and putting them together in all kinds of positions, as if he wanted to make something out of them as we try to form various pictures in a puzzle. He composed many different words but there was one word he could not form though he wished it very much. It was the word "Eternity". The Snow Queen said to him, "When you form this word you will overcome my power and become your own master." But Kay could not do it.

"Now I must hurry to warmer countries," said the Snow Queen and she flew away leaving little Kay quite alone in the great hall. Just at this time Gerda came through the great door of the palace. She went on till she came to the large empty hall and saw Kay. She ran to him and threw her arms round his neck and cried out, "Kay, dear Kay, I've found you at last!"

But he sat quite still as if frozen. Little Gerda began to cry and her hot tears fell on his breast and inside to his heart. Her tears melted the piece of ice which was there. Then she looked at him and began to sing the song that they often sang together and Kay burst into tears, and he wept so that the bit of the magic glass swam out of his eye. Then he recognized Gerda and cried out joyfully, "Gerda, dear Gerda, where were you all this time and where was I?" And he looked around and said, "How cold it is and how large and empty it all looks!" And they began to dance, and when they were tired and lay down, the pieces of ice formed themselves into the letters of the word "Eternity" which the Snow Queen told Kay to form before he could overcome her power.

Then they took each other by the hands and went out from the great palace of ice. When they arrived at the bush with red berries, there stood the reindeer waiting for them. He brought a young she-reindeer with him and the children drank her warm milk and kissed her on the mouth. The reindeers carried Kay and Gerda first to the Finland woman where they warmed themselves in the hot room. And then to the Lapland woman who made some new clothes for them. The reindeers carried them to the borders of Lapland and said, "Farewell."

Suddenly the birds began to sing and the forest was full of green leaves. And out of the forest came a beautiful horse which Gerda remembered because it was the horse which drew the golden coach. A young girl with a red cap on her head and pistols in her belt was riding it. It was the little robber-girl. The girls were very glad to see each other.

"You must be a fine fellow," the robber-girl said to Kay, "if Gerda went to the end of the world to find you." Then Gerda and Kay told her the end of their story. "Sneep, snup, snare. It's all right at last," said the little robber-girl. And she rode away into the wide world. And Gerda and Kay went hand-in-hand towards home.

When they came to their town, it was already spring and everywhere there were beautiful flowers. They went upstairs into their grandmother's room where all looked as before. But when they passed through the door into the room, they realized that they were both grown up. And when Kay and Gerda sat down on their chairs and held each other by the hand, the cold empty palace of the Snow Queen vanished from their memory like a bad dream.`,

// Главная функция получения загадки
function getRiddleForWord(word) {
    const key = (word.en || '').toLowerCase().trim();
    // 1. Ручная таблица — приоритет
    if (RIDDLES_RU[key]) return RIDDLES_RU[key];
    // 2. Поле в данных (если вы где-то задали)
    if (word.riddle) return word.riddle;
    // 3. Вернём пустоту — AI подгрузится асинхронно
    return '';
}

// ============================================================
const VERBS_SET = new Set(
    (wordsData.basic_verbs || []).map(w => w.en.toLowerCase().trim())
);

function getDisplayEn(en) {
    if (!en) return '';
    return VERBS_SET.has(en.toLowerCase().trim()) ? 'to ' + en : en;
}

function dedupeWords(arr) {
    const seen = new Set();
    return arr.filter(w => {
        const key = (w.en || '').toLowerCase().trim();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

function renderDictSearchResults(container, query) {
    const q = query.toLowerCase().trim();
    const isNumeric = /^\d+$/.test(q);
    const numQ = isNumeric ? parseInt(q, 10) : null;

    // Собираем все слова из всех категорий, группируя переводы
    const byKey = new Map();
    for (const catId in wordsData) {
        (wordsData[catId] || []).forEach(w => {
            const key = w.en.toLowerCase().trim();
            if (!byKey.has(key)) {
                byKey.set(key, {
                    en: w.en,
                    ru: w.ru,
                    emoji: w.emoji,
                    meanings: [w.ru]
                });
            } else {
                const item = byKey.get(key);
                if (!item.meanings.includes(w.ru)) {
                    item.meanings.push(w.ru);
                }
            }
        });
    }
    const allWords = [...byKey.values()];

    let matchedWords;

    if (isNumeric) {
        matchedWords = allWords.filter(w => {
            const v = numberValue(w.en);
            return v !== null && v === numQ;
        });
    } else {
        matchedWords = allWords.filter(w =>
            w.en.toLowerCase().includes(q) ||
            w.meanings.some(m => m.toLowerCase().includes(q))
        );
    }

    const matchedPhrases = phrasesData.filter(p =>

const NUMBER_WORDS_MAP = {
    'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5,
    'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10,
    'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14, 'fifteen': 15,
    'sixteen': 16, 'seventeen': 17, 'eighteen': 18, 'nineteen': 19, 'twenty': 20,
    'thirty': 30, 'forty': 40, 'fifty': 50, 'sixty': 60, 'seventy': 70,
    'eighty': 80, 'ninety': 90, 'hundred': 100, 'thousand': 1000
};

const ORDINAL_WORDS_MAP = {
    'zeroth': 0, 'first': 1, 'second': 2, 'third': 3, 'fourth': 4, 'fifth': 5,
    'sixth': 6, 'seventh': 7, 'eighth': 8, 'ninth': 9, 'tenth': 10,
    'eleventh': 11, 'twelfth': 12, 'thirteenth': 13, 'fourteenth': 14, 'fifteenth': 15,
    'sixteenth': 16, 'seventeenth': 17, 'eighteenth': 18, 'nineteenth': 19, 'twentieth': 20,
    'thirtieth': 30, 'fortieth': 40, 'fiftieth': 50, 'sixtieth': 60,
    'seventieth': 70, 'eightieth': 80, 'ninetieth': 90, 'hundredth': 100
};

const ORDINAL_BASE_MAP = {
    'first': 1, 'second': 2, 'third': 3, 'fourth': 4, 'fifth': 5,
    'sixth': 6, 'seventh': 7, 'eighth': 8, 'ninth': 9, 'tenth': 10,
    'eleventh': 11, 'twelfth': 12, 'thirteenth': 13, 'fourteenth': 14, 'fifteenth': 15,
    'sixteenth': 16, 'seventeenth': 17, 'eighteenth': 18, 'nineteenth': 19, 'twentieth': 20,
    'thirtieth': 30, 'fortieth': 40, 'fiftieth': 50, 'sixtieth': 60,
    'seventieth': 70, 'eightieth': 80, 'ninetieth': 90, 'hundredth': 100,
    'zeroth': 0
};

/**
 * Преобразует английское числительное (количественное или порядковое)
 * в число. Возвращает null, если слово не является числительным.
 */
function numberValue(str) {
    if (!str) return null;
    const s = str.toLowerCase().trim().replace(/\s+/g, ' ');

    // Прямое совпадение с порядковым (first, second, twentieth...)
    if (ORDINAL_WORDS_MAP[s] !== undefined) return ORDINAL_WORDS_MAP[s];

    // Составные порядковые: "twenty-first", "one hundredth" и т.п.
    const parts = s.split(/[\s-]+/);

    // Если последняя часть — порядковое слово
    const last = parts[parts.length - 1];
    if (ORDINAL_BASE_MAP[last] !== undefined) {
        let total = 0;
        let current = 0;
        for (let i = 0; i < parts.length - 1; i++) {
            const p = parts[i];
            if (NUMBER_WORDS_MAP[p] !== undefined) {
                const v = NUMBER_WORDS_MAP[p];
                if (v === 100) {
                    current = (current || 1) * 100;
                } else if (v === 1000) {
                    total += (current || 1) * 1000;
                    current = 0;
                } else {
                    current += v;
                }
            }
        }
        total += current + ORDINAL_BASE_MAP[last];
        return total;
    }

    // Количественные: "one", "twenty-one", "one hundred twenty-three"
    let total = 0;
    let current = 0;
    let foundAny = false;
    for (const p of parts) {
        if (NUMBER_WORDS_MAP[p] !== undefined) {
            foundAny = true;
            const v = NUMBER_WORDS_MAP[p];
            if (v === 100) {
                current = (current || 1) * 100;
            } else if (v === 1000) {
                total += (current || 1) * 1000;
                current = 0;
            } else {
                current += v;
            }
        }
    }
    if (!foundAny) return null;
    return total + current;
}

/**
 * Проверяет, является ли поисковый запрос числом.
 */
function isNumericQuery(q) {
    return /^\d+$/.test(q.trim());
}

function renderWordsGrid(allWords) {
    const grid = document.getElementById('words-grid');
    if (!grid) return;
    const isNumbersCategory = currentWordCategory === 'numbers_basic'
        || currentWordCategory === 'ordinal_numbers';

    // Категории, которые нужно сортировать в логическом порядке
      const ORDERED_CATEGORIES = {
        'seasons_basic': ['winter', 'spring', 'summer', 'autumn', 'fall'],
        'months_basic': [
            'january','february','march','april','may','june',
            'july','august','september','october','november','december',
            'on the first of january',
            'the first of may',
            'the second of june',
            'the third of july',
            'the twenty-third of june',
            'on the twenty-fifth of december',
            'the thirty-first of december'
        ],
        'days_basic': ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'],
        'daytime_basic': ['morning','afternoon','evening','night','midday','midnight'],
        'time_common': [
            'yesterday','today','tomorrow','the day after tomorrow',
            'noon','midnight','for a while','in the morning',
            'a day','a week','a month','a year',
            'a decade','a century','a millennium','a leap year'
        ],
        'time_clock': [
            'a.m.','p.m.','half an hour',
            'half past twelve','half past one','half past two',
            'five minutes to one','five minutes to two','five minutes to three',
            'a quarter to one','a quarter to two','a quarter to three',
            'one thirty','two thirty','three thirty',
            'mechanical clock','digital clock'
        ],
        'holidays_basic': [
            'holiday','birthday','new year','christmas',
            'santa claus','father frost','reindeer',
            'new year tree','christmas tree',
            'candle','bells',
            'present','gift','gift wrapping',
            'card','postcard','invitation','fair',
            'cake','dream','wish',
            'make a wish','blow out the candles','put under the tree'
        ]
    };

    const isOrderedCategory = Object.prototype.hasOwnProperty.call(
        ORDERED_CATEGORIES, currentWordCategory
    );

    let filtered = allWords;

    if (currentSearchQuery) {
        const q = currentSearchQuery;

        if (isNumericQuery(q)) {
            const numQ = parseInt(q, 10);
            filtered = allWords.filter(w => {
                const v = numberValue(w.en);
                return v !== null && v === numQ;
            });
        } else {
            filtered = allWords.filter(w =>
                w.en.toLowerCase().includes(q) ||
                w.ru.toLowerCase().includes(q)
            );
        }
    }

    // Сортировка: числа — по значению; ordered-категории — по заданному порядку; остальные — по алфавиту
    if (isNumbersCategory && !currentSearchQuery) {
        filtered = [...filtered].sort((a, b) => {
            const va = numberValue(a.en);
            const vb = numberValue(b.en);
            if (va === null && vb === null) return a.en.localeCompare(b.en);
            if (va === null) return 1;
            if (vb === null) return -1;
            return va - vb;
        });
    } else if (isOrderedCategory && !currentSearchQuery) {
        const order = ORDERED_CATEGORIES[currentWordCategory];
        filtered = [...filtered].sort((a, b) => {
            const ia = order.indexOf(a.en.toLowerCase().trim());
            const ib = order.indexOf(b.en.toLowerCase().trim());
            if (ia === -1 && ib === -1) return a.en.localeCompare(b.en);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
        });
    } else {
        filtered = [...filtered].sort((a, b) => a.en.localeCompare(b.en));
    }

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">😔 Ничего не найдено по запросу «${currentSearchQuery}»</div>`;
        return;
    }

    let html = '';
    let lastLetter = null;

    if (currentSearchQuery || isNumbersCategory || isOrderedCategory) {
        // Без буквенных заголовков — просто список
        html = filtered.map(w => wordCardHTML(w)).join('');
    } else {
        filtered.forEach(w => {
            const letter = w.en[0].toUpperCase();
            if (letter !== lastLetter) {
                html += `<div class="letter-group-title" data-letter-anchor="${letter}">${letter}</div>`;
                lastLetter = letter;
            }
            html += wordCardHTML(w);
        });
    }

    grid.innerHTML = html;

    grid.querySelectorAll('[data-speak-word]').forEach(btn => {
        btn.addEventListener('click', () => {
            speakWord(btn.dataset.speakWord, btn);
        });
    });

    grid.querySelectorAll('[data-add-word]').forEach(btn => {
        btn.addEventListener('click', () => {
            const word = btn.dataset.addWord;
            if (isInMyDict(word)) {
                removeFromMyDict(word);
                btn.textContent = '➕';
                btn.title = 'Добавить в Мой словарик';
            } else {
                addToMyDict(word);
                btn.textContent = '✅';
                btn.title = 'В Моём словарике — клик, чтобы удалить';
            }
            renderSidebarList();
            updateSidebarTitle();
            updateDictCounter();
        });
    });
}

const MY_DICT_KEY = 'goodStart_myDictionary';

function loadMyDict() {
    try {
        const raw = localStorage.getItem(MY_DICT_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
}

function saveMyDict(dict) {
    try { localStorage.setItem(MY_DICT_KEY, JSON.stringify(dict)); }
    catch (e) { console.warn('Не удалось сохранить', e); }
}

let myDictionary = loadMyDict();

function addToMyDict(word) {
    const wordLower = word.toLowerCase().trim();
    if (myDictionary.some(item => item.word.toLowerCase() === wordLower)) return false;
    myDictionary.push({ word: word, customTranslation: '', addedAt: Date.now() });
    saveMyDict(myDictionary);
    updateDictCounter();
    return true;
}

function removeFromMyDict(word) {
    const wordLower = word.toLowerCase().trim();
    myDictionary = myDictionary.filter(item => item.word.toLowerCase() !== wordLower);
    saveMyDict(myDictionary);
    updateDictCounter();
}

function isInMyDict(word) {
    const wordLower = word.toLowerCase().trim();
    return myDictionary.some(item => item.word.toLowerCase() === wordLower);
}

function unmarkLearned(word) {

}

// ============================================================
// УМНОЕ РАЗБИЕНИЕ АБЗАЦА НА ЧАСТИ
// ============================================================
function smartSplitParagraph(paragraph) {
    if (paragraph.length < 200) return [paragraph];

    // Разбиваем на предложения без lookbehind (совместимо со старыми Safari)
    const sentences = paragraph.match(/[^.!?…]+[.!?…]+["»”]?/g) || [paragraph];

    const result = [];
    let buffer = '';

    sentences.forEach((s, i) => {
        buffer += (buffer ? ' ' : '') + s.trim();
        if (buffer.length > 300 || i === sentences.length - 1) {
            result.push(buffer);
            buffer = '';
        }
    });

    if (buffer) result.push(buffer);
    return result;
}

function renderBookReader() {
    const book = currentBook;
    if (!book) return;
    const chapter = book.chapters[currentChapterIndex];
    if (!chapter) return;

        const htmlText = chapter.text.split(/\n\n+/).map(paragraph => {
        // Разбиваем абзац на части по предложениям,
        // но КАЖДУЮ реплику диалога делаем отдельным абзацем
        const paragraphs = smartSplitParagraph(paragraph);

        return paragraphs.map(p => {
            const words = p.split(/(\s+)/);
            return '<p>' + words.map(part => {
                if (/^\s+$/.test(part)) return part;
                const cleanWord = part
                    .replace(/[^a-zA-Z'’‘`´\-]/g, '')
                    .replace(/[’‘`´]/g, "'");
                if (!cleanWord) return part;
                return `<span class="word" data-word="${cleanWord.replace(/"/g, '&quot;')}">${part}</span>`;
            }).join('') + '</p>';
        }).join('');
    }).join('');

    const chaptersNav = book.chapters.map((ch, i) =>
        `<button class="chapter-btn ${i === currentChapterIndex ? 'active' : ''}" data-chapter="${i}">${ch.title}</button>`
    ).join('');

    let notesHtml = '';
    if (chapter.notes) {
        let notesProcessed = chapter.notes.replace(/_{2,}/g, () => {
            return `<input type="text" class="gap-input" autocomplete="off" spellcheck="false">`;
        });
        notesHtml = `<div class="chapter-notes">${notesProcessed}</div>`;
    }

    contentEl.innerHTML = `
        <div class="book-reader">
            <div class="book-text-area">
                <div class="reader-header">
                    <div class="reader-title">${book.cover} ${book.title}</div>
                    <button class="back-btn" id="back-to-books">← К книгам</button>
                </div>
                <div class="chapter-nav">${chaptersNav}</div>
                <div class="book-text" id="book-text">${htmlText}</div>
                ${notesHtml}
            </div>
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">📖 Мой словарик (${myDictionary.length})</div>
                    <button class="sidebar-close" id="sidebar-close">✕</button>
                </div>
                <div class="sidebar-list" id="sidebar-list"></div>
            </div>
        </div>
    `;

    document.getElementById('back-to-books').addEventListener('click', () => {
        hideTooltip(); closeSidebar(); renderBookLevels();
    });

    document.querySelectorAll('.chapter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            hideTooltip();
            currentChapterIndex = parseInt(btn.dataset.chapter);
            currentSelection = [];
            renderBookReader();
        });
    });

    document.querySelectorAll('.book-text .word').forEach(wordEl => {
        wordEl.addEventListener('click', (e) => handleWordClick(wordEl, e));
        wordEl.addEventListener('mouseenter', () => {
            tooltipWord = wordEl;
            showTooltip(wordEl, wordEl.dataset.word);
        });
        wordEl.addEventListener('mouseleave', () => hideTooltip());
    });

    document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
    renderSidebarList();
    attachExerciseHandlers(book, currentChapterIndex);
}

// ============================================================
// ИНТЕРАКТИВНЫЕ УПРАЖНЕНИЯ (поля ввода)
// ============================================================
function attachExerciseHandlers(book, chapterIndex) {
    const notesEl = document.querySelector('.chapter-notes');
    if (!notesEl) return;
    const storageKey = `ex_${book.id}_${chapterIndex}`;
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    const inputs = notesEl.querySelectorAll('.gap-input');
    inputs.forEach((inp, i) => {
        inp.dataset.gapIndex = i;
        const savedVal = saved[i];
        if (savedVal) inp.value = savedVal;
        inp.addEventListener('input', () => {
            const data = JSON.parse(localStorage.getItem(storageKey) || '{}');
            data[i] = inp.value;
            localStorage.setItem(storageKey, JSON.stringify(data));
        });
    });

    // Кнопка "Очистить" вставляется через DOM, а не через хрупкую регулярку
    const exerciseBlock = notesEl.querySelector('.exercise');
    if (exerciseBlock && inputs.length > 0) {
        const actions = document.createElement('div');
        actions.className = 'exercise-actions';
        const resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.className = 'reset-btn';
        resetBtn.textContent = '🔄 Очистить';
        resetBtn.addEventListener('click', () => {
            inputs.forEach(inp => { inp.value = ''; });
            localStorage.removeItem(storageKey);
        });
        actions.appendChild(resetBtn);
        exerciseBlock.appendChild(actions);
    }
}
