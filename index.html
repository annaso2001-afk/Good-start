let popupOutsideHandler = null;

function handleWordClick(wordEl, event) {
    const word = wordEl.dataset.word;
    if (!word) return;
    if (event.shiftKey && currentSelection.length > 0) {
        if (!currentSelection.includes(wordEl)) {
            currentSelection.push(wordEl);
            wordEl.classList.add('selected');
            speakMultipleWords();
        }
        return;
    }
    clearSelection();
    wordEl.classList.add('selected');
    currentSelection = [wordEl];
    speakWord(word);
    showWordActions(wordEl, word);
    setTimeout(() => {
        wordEl.classList.add('fade-out');
        setTimeout(() => {
            wordEl.classList.remove('selected');
            wordEl.classList.remove('fade-out');
        }, 400);
    }, 2000);
}

function speakMultipleWords() {
    const words = currentSelection.map(el => el.dataset.word).join(' ');
    speakWord(words);
}

function clearSelection() {
    currentSelection.forEach(el => {
        el.classList.remove('selected');
        el.classList.remove('fade-out');
    });
    currentSelection = [];
    const popup = document.getElementById('word-popup');
    if (popup) popup.remove();
    if (popupOutsideHandler) {
        document.removeEventListener('click', popupOutsideHandler);
        popupOutsideHandler = null;
    }
}

function showWordActions(wordEl, word) {
    const oldPopup = document.getElementById('word-popup');
    if (oldPopup) oldPopup.remove();

    const rect = wordEl.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.id = 'word-popup';
    popup.style.position = 'fixed';
    popup.style.left = (rect.left + rect.width / 2) + 'px';
    popup.style.top = (rect.top - 55) + 'px';
    popup.style.transform = 'translateX(-50%)';
    popup.style.background = '#fff';
    popup.style.border = '3px solid #ff6b9d';
    popup.style.borderRadius = '15px';
    popup.style.padding = '6px 10px';
    popup.style.display = 'flex';
    popup.style.gap = '8px';
    popup.style.boxShadow = '0 6px 20px rgba(0,0,0,0.2)';
    popup.style.zIndex = '200';
    const alreadySaved = isInMyDict(word);
    popup.innerHTML = `
        <button id="popup-speak" style="background:none;border:none;cursor:pointer;font-size:1.3rem;" title="Озвучить">🔊</button>
        <button id="popup-add" style="background:none;border:none;cursor:pointer;font-size:1.3rem;" title="${alreadySaved ? 'Клик — удалить' : 'Клик — добавить'}">${alreadySaved ? '✅' : '➕'}</button>
    `;
    document.body.appendChild(popup);
    document.getElementById('popup-speak').addEventListener('click', (e) => {
        e.stopPropagation();
        speakWord(word);
    });
    const addBtn = document.getElementById('popup-add');
    addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isInMyDict(word)) {
            removeFromMyDict(word);
            addBtn.textContent = '➕';
            addBtn.title = 'Клик — добавить';
            renderSidebarList();
            updateSidebarTitle();
            if (sidebarOpen) openSidebar();
        } else {
            addToMyDict(word);
            addBtn.textContent = '✅';
            addBtn.title = 'Клик — удалить';
            renderSidebarList();
            updateSidebarTitle();
            openSidebar();
        }
    });

    // Удаляем старый слушатель перед добавлением нового (защита от накопления)
    if (popupOutsideHandler) {
        document.removeEventListener('click', popupOutsideHandler);
    }
    popupOutsideHandler = function(e) {
        const p = document.getElementById('word-popup');
        if (p && !p.contains(e.target) && !e.target.classList.contains('word')) {
            p.remove();
            document.removeEventListener('click', popupOutsideHandler);
            popupOutsideHandler = null;
        }
    };
    setTimeout(() => {
        document.addEventListener('click', popupOutsideHandler);
    }, 0);
}

function renderWordsList(container, isSidebar) {
        if (myDictionary.length === 0) {
        container.innerHTML = `<div class="sidebar-empty">Словарик пуст.<br>Выдели любое слово на странице и нажми ➕ в поп-апе</div>`;
        return;
    }
    container.innerHTML = myDictionary.map(item => {
        const langFlag = item.lang === 'ru' ? '🇷🇺 ' : (item.lang === 'en' ? '🇬🇧 ' : '');
        return `
        <div class="dict-word" data-word-card="${item.word}">
            <div class="dict-word-header">
            <div class="dict-word-en">${langFlag}${getDisplayEn(item.word)}</div>
                <div class="dict-word-actions">
                    <button data-speak="${item.word}" title="Озвучить">🔊</button>
                    <button data-refresh="${item.word}" title="Обновить перевод">🔄</button>
                    <button data-edit="${item.word}" title="Редактировать">✏️</button>
                    <button data-remove="${item.word}" title="Удалить">❌</button>
                </div>
            </div>
            <div class="dict-word-translation" data-translation-for="${item.word}">
                <span class="loading-translation">⏳ загрузка перевода...</span>
            </div>
        </div>
    `;
    }).join('');

      container.querySelectorAll('[data-speak]').forEach(btn => {
        btn.addEventListener('click', () => {
            const w = btn.dataset.speak;
            const item = myDictionary.find(x => x.word === w);
            if (item && item.lang === 'ru' && item.customTranslation) {
                speakWord(item.customTranslation);
            } else {
                speakWord(w);
            }
        });
    });

    container.querySelectorAll('[data-refresh]').forEach(btn => {
        btn.addEventListener('click', async () => {
            const word = btn.dataset.refresh;
            const wordLower = word.toLowerCase().trim();
            const block = container.querySelector(`[data-translation-for="${CSS.escape(word)}"]`);
            if (block) block.innerHTML = `<span class="loading-translation">⏳ обновление...</span>`;
            btn.style.transform = 'rotate(360deg)';
            btn.style.transition = 'transform 0.6s';
            setTimeout(() => {
                btn.style.transform = '';
                btn.style.transition = '';
            }, 700);
            delete translationCache[wordLower];
            localStorage.removeItem('translation_' + wordLower);
            const newTranslation = await getTranslation(word);
            if (block) {
                block.innerHTML = `<span class="translation-text">${newTranslation}</span>`;
            }
        });
    });

    container.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
            removeFromMyDict(btn.dataset.remove);
            renderWordsList(container, isSidebar);
            updateSidebarTitle();
        });
    });

    container.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => openEditForm(container, btn.dataset.edit, isSidebar));
    });

    // Последовательная асинхронная загрузка переводов (без forEach + async)
        (async () => {
        for (const item of myDictionary) {
            let translation;
            if (item.customTranslation) {
                translation = item.customTranslation;
            } else if (item.lang === 'ru') {
                const res = await translateAnyWord(item.word);
                translation = res.translation;
            } else {
                translation = await getTranslation(item.word);
            }
            showTranslation(item.word, translation);
        }
    })();
}

function showTranslation(word, translation) {
    document.querySelectorAll(`[data-translation-for="${CSS.escape(word)}"]`).forEach(el => {
        el.innerHTML = `<span class="translation-text">${translation}</span>`;
    });
}

function openEditForm(container, word, isSidebar) {
    const item = getDictItem(word);
    if (!item) return;
        const card = container.querySelector(`[data-word-card="${CSS.escape(word)}"]`);
    if (!card) return;
    const translationBlock = card.querySelector('.dict-word-translation');
    translationBlock.style.display = 'none';
    const currentTranslation = item.customTranslation || translationBlock.querySelector('.translation-text')?.textContent || '';
    const form = document.createElement('div');
    form.className = 'edit-area';
    form.innerHTML = `
        <div class="edit-label">Перевод (можно изменить):</div>
        <input type="text" id="edit-translation-${word}" value="${currentTranslation.replace(/"/g, '&quot;')}" placeholder="Введи перевод...">
        <div class="edit-actions">
            <button class="save-btn" id="save-${word}">💾 Сохранить</button>
            <button class="cancel-btn" id="cancel-${word}">Отмена</button>
        </div>
    `;
    card.appendChild(form);
    document.getElementById(`save-${word}`).addEventListener('click', () => {
        const newTranslation = document.getElementById(`edit-translation-${word}`).value.trim();
        updateDictItem(word, { customTranslation: newTranslation });
        renderWordsList(container, isSidebar);
    });
    document.getElementById(`cancel-${word}`).addEventListener('click', () => {
        renderWordsList(container, isSidebar);
    });
}

function renderSidebarList() {
    const list = document.getElementById('sidebar-list');
    if (!list) return;
    renderWordsList(list, true);
}

function renderDictionarySection() {
    closeSidebar();
    sidebarToggle.classList.remove('visible');
    hideTooltip();
    currentSection = 'dictionary';
      currentDictCategory = 'my';
    currentDictSearchQuery = '';
    dictHistory = [];
    currentPhraseCategory = null;
    menuCards.forEach(card => card.classList.toggle('active', card.dataset.section === 'dictionary'));

    contentEl.innerHTML = `
        <div style="text-align:center; margin-bottom:20px;">
            <h2 style="color:#4a90e2; font-size:1.5rem; margin-bottom:15px;">📚 Словарик</h2>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
            <button id="clear-cache-btn" style="
                padding: 10px 20px;
                background: linear-gradient(135deg, #ff6b9d 0%, #ffb347 100%);
                color: #fff;
                border: 3px solid #fff;
                border-radius: 20px;
                font-family: inherit;
                font-weight: bold;
                font-size: 0.9rem;
                cursor: pointer;
                box-shadow: 0 6px 20px rgba(255,107,157,0.4);
                transition: all 0.2s;
            ">🧹 Очистить ВЕСЬ кэш переводов</button>
        </div>
        <div id="dict-search-wrapper" style="max-width:700px; margin:0 auto 20px;">
            <input type="text" class="words-search" id="dict-global-search"
                   placeholder="🔍 Поиск по всем словам и идиомам..."
                   style="width:100%; padding:12px 18px; font-size:1rem;">
        </div>
        <div id="dict-categories" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:25px;"></div>
        <div id="dict-content"></div>
    `;

    document.getElementById('clear-cache-btn').addEventListener('click', () => {
        if (!confirm('Удалить ВСЕ сохранённые переводы? Слова в «Моём словарике» останутся, но переводы загрузятся заново.')) return;
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('translation_')) keysToRemove.push(key);
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
        Object.keys(translationCache).forEach(k => delete translationCache[k]);
        const btn = document.getElementById('clear-cache-btn');
        btn.textContent = '✅ Всё очищено!';
        btn.style.background = 'linear-gradient(135deg, #4caf50 0%, #66bb6a 100%)';
        setTimeout(() => {
            btn.textContent = '🧹 Очистить ВЕСЬ кэш переводов';
            btn.style.background = 'linear-gradient(135deg, #ff6b9d 0%, #ffb347 100%)';
        }, 1500);
        renderDictContent();
    });

    document.getElementById('dict-global-search').addEventListener('input', (e) => {
        currentDictSearchQuery = e.target.value;
        renderDictContent();
    });

    renderDictCategories();
    renderDictContent();
}

    if (currentDictCategory !== newCategory) {

    currentDictCategory = newCategory;
    currentDictSearchQuery = '';
    currentPhraseCategory = null;   // ← новая строка
    const searchInput = document.getElementById('dict-global-search');
    if (searchInput) searchInput.value = '';
    renderDictCategories();
    renderDictContent();
}

    currentDictCategory = dictHistory.length > 0 ? dictHistory.pop() : 'my';

    renderDictCategories();
    renderDictContent();

function renderDictContent() {
    const container = document.getElementById('dict-content');
    if (!container) return;

    const catsContainer = document.getElementById('dict-categories');
    const searchWrapper = document.getElementById('dict-search-wrapper');

    // === РЕЖИМ ПОИСКА ===
    if (currentDictSearchQuery.trim()) {
        if (catsContainer) catsContainer.style.display = 'none';
        renderDictSearchResults(container, currentDictSearchQuery);
        return;
    }

    // === ПОДКАТЕГОРИЯ СО СЛОВАМИ ===
    const allSubcats = [...basicSubCategories, ...wordSubCategories];
    const isSubcat = allSubcats.some(c => c.id === currentDictCategory);
    if (isSubcat && wordsData[currentDictCategory]) {
        if (catsContainer) catsContainer.style.display = 'none';
        if (searchWrapper) searchWrapper.style.display = 'none';
        renderWordCategoryInto(container, currentDictCategory);
        return;
    }

    // === ВЕРХНИЙ УРОВЕНЬ ===
    if (catsContainer) catsContainer.style.display = 'flex';
    if (searchWrapper) searchWrapper.style.display = 'block';

    // "Мой словарик"

        container.innerHTML = `<div id="my-dict-list" style="max-width:800px; margin:0 auto;"></div>`;

        return;
    }

      // "Фразы и идиомы" — если выбрана конкретная категория, скрываем верх
    if (currentDictCategory === 'phrases') {
        if (currentPhraseCategory) {
            if (catsContainer) catsContainer.style.display = 'none';
            if (searchWrapper) searchWrapper.style.display = 'none';
        }
        renderPhrasesContent(container);
        return;
    }
    // "Фразовые глаголы"
    if (currentDictCategory === 'phrasal_verbs') {
        if (catsContainer) catsContainer.style.display = 'none';
        if (searchWrapper) searchWrapper.style.display = 'none';
        renderWordCategoryInto(container, 'phrasal_verbs');
        return;
    }
    // "Изучено"
    if (currentDictCategory === 'learned') {

function getLearnedWordsData() {
    const result = [];
    const seen = new Set();

    // 1) Все слова из «Базы» и тематических категорий
    for (const catId in wordsData) {
        (wordsData[catId] || []).forEach(w => {
            const key = w.en.toLowerCase().trim();
            if (!isLearned(key)) return;
            if (seen.has(key)) return;
            seen.add(key);
            result.push({
                en: w.en,
                ru: w.ru,
                emoji: w.emoji || '📘'
            });
        });
    }

    // 2) Слова из «Моего словарика», которых нет в базе
    if (Array.isArray(myDictionary)) {
        myDictionary.forEach(item => {
            const word = (item.word || '').trim();
            if (!word) return;
            const key = word.toLowerCase();
            if (!isLearned(key)) return;
            if (seen.has(key)) return;
            seen.add(key);

            const lang = item.lang || (typeof detectWordLang === 'function'
                ? detectWordLang(word) : 'en') || 'en';

            if (lang === 'ru') {
                result.push({
                    en: item.customTranslation || word,
                    ru: word,
                    emoji: '🇷🇺'
                });
            } else {
                let ru = item.customTranslation || '';
                let emoji = '⭐';
                if (!ru) {
                    for (const cat in wordsData) {
                        const found = (wordsData[cat] || []).find(x =>
                            x.en.toLowerCase().trim() === key
                        );
                        if (found) { ru = found.ru; emoji = found.emoji || '⭐'; break; }
                    }
                }
                result.push({ en: word, ru: ru || '…', emoji });
            }
        });
    }

    return result.sort((a, b) => a.en.localeCompare(b.en));
}

// --- Маленький помощник для склонения «фраз» ---
function pluralize(n, forms) {
    n = Math.abs(n) % 100;
    const n1 = n % 10;
    if (n > 10 && n < 20) return forms[2];
    if (n1 > 1 && n1 < 5)  return forms[1];
    if (n1 === 1)          return forms[0];
    return forms[2];
}

function getAdultsMyDictWords() {
    const result = [];
    const seen = new Set();

    if (Array.isArray(myDictionary)) {
        myDictionary.forEach(item => {
            const word = (item.word || '').trim();
            if (!word) return;
            const key = word.toLowerCase();
            if (seen.has(key)) return;
            seen.add(key);

            let ru = item.customTranslation || '';
            let emoji = '⭐';
            if (!ru) {
                for (const cat in wordsData) {
                    const found = (wordsData[cat] || []).find(x =>
                        x.en.toLowerCase().trim() === key
                    );
                    if (found) { ru = found.ru; emoji = found.emoji || '⭐'; break; }
                }
            }
            result.push({ en: word, ru: ru || '…', emoji });
        });
    }
    return result;
}

function getAdultsLearnedWords() {
    return getLearnedWordsData();
}
// Все слова из тематических категорий (без "Базы")
function getAdultsWordsFromThemes() {
    const result = [];
    const seen = new Set();
    

    wordSubCategories.forEach(cat => {
        (wordsData[cat.id] || []).forEach(w => {
            const key = w.en.toLowerCase().trim();
            if (seen.has(key)) return;
            seen.add(key);
            result.push(w);
        });
    });

    return result;
}

// Все фразы превращаем в слова {en, ru}
function getAdultsPhrasesAsWords() {
    const result = [];
    const seen = new Set();

    phrasesData.forEach(p => {
        const key = p.en.toLowerCase().trim();
        if (seen.has(key)) return;
        seen.add(key);

        // Обрезаем конечную точку, чтобы игры работали корректно
        const en = p.en.replace(/[.!?…]+$/, '').trim();

        // Фразы длиннее 60 символов не подойдут для некоторых игр,
        // но их можно отфильтровать внутри конкретной игры
        result.push({
            en: en,
            ru: p.ru,
            emoji: '💬'
        });
    });

    return result;
}

let trainingState = null;

const TR_STAGES_TOTAL = 4;

];

function trShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startTrainingSession(words) {
    const pool = (words || []).filter(w =>
        w.en && w.ru && w.ru !== '…' &&
        w.en.trim().toLowerCase() !== w.ru.trim().toLowerCase()
    );

    if (pool.length < 4) {
        contentEl.innerHTML = `
            <div style="text-align:center;">
                <button class="games-back-btn" id="back-to-kids-games">← К играм</button>

            .addEventListener('click', renderKidsGameList);
        return;

    const selected = trShuffle(pool).slice(0, Math.min(TR_WORDS_COUNT, pool.length));

function renderTrainingSession() {
    const s = trainingState;
    if (!s || s.finished) return;
    if (s.queue.length === 0) { finishTraining(); return; }
    s.taskAnswered = false;

    const screen = document.getElementById('tr-screen');
    if (!screen) return;

    const current = s.queue[0];
    const doneCount = s.done.length;
    const totalCount = s.totalWords;
    const pct = (doneCount / totalCount) * 100;

    const chips = [];
    s.done.forEach(w => {
        chips.push(`<span class="tr-chip done" title="${w.en}">✓ ${truncateTr(w.en)}</span>`);
    });
    chips.push(`<span class="tr-chip current" title="${current.word.en}">▶ ${truncateTr(current.word.en)}</span>`);
    s.queue.slice(1).forEach(item => {
        chips.push(`<span class="tr-chip waiting" title="${item.word.en}">${truncateTr(item.word.en)}</span>`);
    });

    screen.innerHTML = `
        <div class="tr-progress-card">
            <div class="tr-progress-top">
                <span>📚 Освоено: <b>${doneCount} / ${totalCount}</b></span>
                <span>✓ ${s.correct} &nbsp;·&nbsp; ✗ ${s.answered - s.correct}</span>
            </div>
            <div class="tr-progress-bar">
                <div class="tr-progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="tr-chips">${chips.join('')}</div>
        </div>
        <div class="tr-stage-label">
            Стадия ${current.stage + 1} / 4 · ${TR_STAGE_NAMES[current.stage]}
        </div>
        <div class="tr-task" id="tr-task"></div>
    `;

    const stage = current.stage;
    if (stage === 0)      renderTrStage1_Recognize();
    else if (stage === 1) renderTrStage2_Listen();
    else if (stage === 2) renderTrStage3_Reproduce();
    else                  renderTrStage4_Fix();
}

function truncateTr(str) {
    if (!str) return '';
    return str.length > 9 ? str.slice(0, 8) + '…' : str;
}

function getTrDistractors(word, n) {
    const s = trainingState;
    const sessionWords = [...s.queue.map(t => t.word), ...s.done];
    const seen = new Set();
    const uniq = [];
    [...sessionWords, ...s.pool].forEach(w => {
        const key = w.en.toLowerCase();
        if (key === word.en.toLowerCase()) return;
        if (w.ru.toLowerCase() === word.ru.toLowerCase()) return;
        if (seen.has(key)) return;
        seen.add(key);
        uniq.push(w);
    });
    return trShuffle(uniq).slice(0, n);
}

// --- Стадия 1: Узнавание (EN→RU выбор) ---
function renderTrStage1_Recognize() {
    const s = trainingState;
    const word = s.queue[0].word;
    const task = document.getElementById('tr-task');
    if (!task) return;

    const distractors = getTrDistractors(word, 3);
    const options = [
        { text: word.ru, correct: true },
        ...distractors.map(w => ({ text: w.ru, correct: false }))
    ];
    const shuffled = trShuffle(options);

    task.innerHTML = `
        <div class="tr-prompt">
            <div class="tr-prompt-emoji">${word.emoji || '📘'}</div>
            <div class="tr-prompt-word">${word.en}</div>
        </div>
        <div class="tr-options">
            ${shuffled.map((o, i) => `<button class="tr-opt" data-i="${i}">${o.text}</button>`).join('')}
        </div>
    `;

      task.querySelectorAll('.tr-opt').forEach((btn, i) => {
        btn.addEventListener('click', () => {
            if (s.taskAnswered) return;
            s.taskAnswered = true;
            task.querySelectorAll('.tr-opt').forEach(b => b.disabled = true);

            if (shuffled[i].correct) {
                btn.classList.add('correct');
                setTimeout(() => trainingCorrect(), 600);
            } else {
                btn.classList.add('wrong');
                task.querySelectorAll('.tr-opt').forEach((b, j) => {
                    if (shuffled[j].correct) b.classList.add('correct');
                });
                speakWord(word.en);
                setTimeout(() => trainingWrong(), 1300);
            }
        });
    });
}

// --- Стадия 3: Воспроизведение (сборка из букв) ---
function renderTrStage3_Reproduce() {
    const s = trainingState;
    const word = s.queue[0].word;
    const clean = word.en.replace(/[^A-Za-z]/g, '');

    // Если слово не собирается из букв (пробелы, дефисы, слишком длинное) — переходим к вводу
    if (clean !== word.en || clean.length < 3 || clean.length > 10) {
        return renderTrTypingFallback();
    }

    const task = document.getElementById('tr-task');
    if (!task) return;

    const letters = clean.split('').map((ch, i) => ({ id: i, letter: ch }));
    const shuffledLetters = trShuffle(letters);
    const slots = new Array(letters.length).fill(null);
    let finished = false;

    task.innerHTML = `
        <div class="tr-prompt" style="padding:16px 20px;">
            <div class="tr-prompt-emoji">${word.emoji || '📘'}</div>
            <div class="tr-prompt-word ru">${word.ru}</div>
        </div>
        <div class="tr-slots" id="tr-slots">
            ${slots.map((_, i) => `<div class="tr-slot" data-slot="${i}"></div>`).join('')}
        </div>
        <div class="tr-pool" id="tr-pool">
            ${shuffledLetters.map(t => `<button class="tr-letter" data-letter="${t.id}">${t.letter}</button>`).join('')}
        </div>
    `;

    const slotsEl = task.querySelector('#tr-slots');
    const poolEl  = task.querySelector('#tr-pool');

    function update() {
        slotsEl.querySelectorAll('.tr-slot').forEach((sl, i) => {
            const id = slots[i];
            if (id === null) { sl.textContent = ''; sl.classList.remove('filled'); }
            else { sl.textContent = letters[id].letter; sl.classList.add('filled'); }
        });
        poolEl.querySelectorAll('.tr-letter').forEach(btn => {
            const id = parseInt(btn.dataset.letter, 10);
            if (slots.includes(id)) { btn.classList.add('used'); btn.disabled = true; }
            else { btn.classList.remove('used'); btn.disabled = false; }
        });
    }

    poolEl.querySelectorAll('.tr-letter').forEach(btn => {
        btn.addEventListener('click', () => {
            if (finished || s.taskAnswered) return;
            const id = parseInt(btn.dataset.letter, 10);
            if (slots.includes(id)) return;
            const empty = slots.indexOf(null);
            if (empty === -1) return;
            slots[empty] = id;
            update();

            if (!slots.includes(null)) {
                const assembled = slots.map(id => letters[id].letter).join('');
                if (assembled.toLowerCase() === clean.toLowerCase()) {
                    finished = true;
                    s.taskAnswered = true;
                    slotsEl.classList.add('correct');
                    speakWord(clean);
                    setTimeout(() => trainingCorrect(), 800);
                } else {
                    s.taskAnswered = true;
                    slotsEl.classList.add('wrong');
                    poolEl.querySelectorAll('.tr-letter').forEach(b => b.disabled = true);
                    speakWord(clean);
                    setTimeout(() => {
                        slotsEl.classList.remove('wrong');
                        trainingWrong();
                    }, 1300);
                }
            }
        });
    });

    slotsEl.querySelectorAll('.tr-slot').forEach(sl => {
        sl.addEventListener('click', () => {
            if (finished || s.taskAnswered) return;
            const i = parseInt(sl.dataset.slot, 10);
            if (slots[i] === null) return;
            slots[i] = null;
            update();
        });
    });

    update();
}

// --- Стадия 3 (fallback для неразбираемых слов): ввод ---
function renderTrTypingFallback() {
    renderTrTypingTask(2);
}

// --- Стадия 4: Закрепление (свободный ввод RU→EN) ---
function renderTrStage4_Fix() {
    renderTrTypingTask(3);
}

function renderTrTypingTask() {
    const s = trainingState;
    const word = s.queue[0].word;
    const task = document.getElementById('tr-task');
    if (!task) return;

    task.innerHTML = `
        <div class="tr-prompt" style="padding:16px 20px;">
            <div class="tr-prompt-emoji">${word.emoji || '📘'}</div>
            <div class="tr-prompt-word ru">${word.ru}</div>
        </div>
        <div class="tr-input-wrap">
            <input type="text" class="tr-input" id="tr-input"
                   placeholder="Напиши по-английски..."
                   autocomplete="off" spellcheck="false"
                   autocapitalize="off" autocorrect="off">
        </div>
        <button class="tr-submit" id="tr-submit">Проверить</button>
    `;

    const input = document.getElementById('tr-input');
    const submit = document.getElementById('tr-submit');
    setTimeout(() => input.focus(), 120);

    function check() {
        if (s.taskAnswered) return;
        s.taskAnswered = true;

        const val = input.value.trim().toLowerCase().replace(/[.!?]+$/, '');
        const target = word.en.trim().toLowerCase();

        input.disabled = true;
        submit.disabled = true;

        if (val === target) {
            input.classList.add('correct');
            speakWord(word.en);
            setTimeout(() => trainingCorrect(), 700);
        } else {
            input.classList.add('wrong');
            setTimeout(() => {
                input.classList.remove('wrong');
                input.value = word.en;
                input.classList.add('show-correct');
            }, 350);
            speakWord(word.en);
            setTimeout(() => trainingWrong(), 1600);
        }
    }

    submit.addEventListener('click', check);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') check();
    });
}

// --- Переходы ---
function trainingCorrect() {
    const s = trainingState;
    if (!s) return;

    s.correct++;
    s.answered++;

    const task = s.queue.shift();
    task.stage++;

    if (task.stage >= TR_STAGES_TOTAL) {
        s.done.push(task.word);
        if (typeof markLearned === 'function') markLearned(task.word.en);
    } else {
        s.queue.push(task);
    }

    if (s.queue.length === 0) {
        finishTraining();
    } else {
        renderTrainingSession();
    }
}

function trainingWrong() {
    const s = trainingState;
    if (!s) return;

    s.answered++;

    const task = s.queue.shift();
    s.queue.push(task);

    renderTrainingSession();
}

// --- Финал ---
function finishTraining() {
    const s = trainingState;
    if (!s || s.finished) return;
    s.finished = true;

    const elapsedSec = Math.round((Date.now() - s.startTime) / 1000);
    const min = Math.floor(elapsedSec / 60);
    const sec = elapsedSec % 60;

    const percent = s.answered > 0
        ? Math.round((s.correct / s.answered) * 100)
        : 0;

    let emoji = '🏆';
    let message = 'Все слова освоены!';
    if (s.answered === 0)     { emoji = '⏸'; message = 'Тренировка не началась'; }
    else if (percent < 40)    { emoji = '💪'; message = 'Хорошая работа, продолжай!'; }
    else if (percent < 60)    { emoji = '👍'; message = 'Неплохой результат!'; }
    else if (percent < 80)    { emoji = '🎉'; message = 'Отличная работа!'; }
    else if (percent < 95)    { emoji = '🌟'; message = 'Превосходно!'; }

    const screen = document.getElementById('tr-screen');
    if (!screen) return;

    screen.innerHTML = `
        <div class="tr-finish">
            <div class="tr-finish-emoji">${emoji}</div>

function pluralizeTr(n, forms) {
    n = Math.abs(n) % 100;
    const n1 = n % 10;
    if (n > 10 && n < 20) return forms[2];
    if (n1 > 1 && n1 < 5) return forms[1];
    if (n1 === 1) return forms[0];
    return forms[2];
}

function getWordsFromSource(source) {
    const result = [];
    const seen = new Set();

    function addWord(w) {
        const key = (typeof w === 'string' ? w : w.en).toLowerCase().trim();
        if (seen.has(key)) return;
        seen.add(key);
        result.push(w);
    }

    // --- Превращает запись из myDictionary в {en, ru, emoji} ---
    function dictItemToWord(item) {
        const word = (item.word || '').trim();
        if (!word) return null;
        const key = word.toLowerCase();
        const lang = item.lang || (typeof detectWordLang === 'function'
            ? detectWordLang(word) : 'en') || 'en';

        if (lang === 'ru') {
            // Русское слово: en = английский перевод, ru = само слово
            return {
                en: item.customTranslation || word,
                ru: word,
                emoji: '🇷🇺'
            };
        }
        // Английское слово
        let ru = item.customTranslation || '';
        let emoji = '⭐';
        if (!ru) {
            for (const cat in wordsData) {
                const found = (wordsData[cat] || []).find(x =>
                    x.en.toLowerCase().trim() === key
                );
                if (found) { ru = found.ru; emoji = found.emoji || '⭐'; break; }
            }
        }
        return { en: word, ru: ru || '…', emoji };
    }
    if (source.type === 'category' && source.categoryId) {
        (wordsData[source.categoryId] || []).forEach(addWord);
    } else if (source.type === 'my') {
        if (Array.isArray(myDictionary)) {
            myDictionary.forEach(item => {
                const w = dictItemToWord(item);
                if (w) addWord(w);
            });
        }
    } else if (source.type === 'learned') {
        if (typeof getLearnedWordsData === 'function') {
            getLearnedWordsData().forEach(addWord);
        }
    } else {
        // 'all' — вся База + Мой словарик
        basicSubCategories.forEach(cat => {
            (wordsData[cat.id] || []).forEach(addWord);
        });
        if (Array.isArray(myDictionary)) {
            myDictionary.forEach(item => {
                const w = dictItemToWord(item);
                if (w) addWord(w);
            });
        }
    }

    return result;
}

function renderFlashcard() {
    const s = flashcardsState;
    const w = s.words[s.index];
    const total = s.words.length;
    const inDict = isInMyDict(w.en);
    const learned = isLearned(w.en);
    const isFirst = s.index === 0;
    const isLast = s.index === total - 1;

    const container = document.getElementById('flashcards-content');
    container.innerHTML = `
        <div class="fc-counter">
            Карточка ${s.index + 1} из ${total}
            ${learned ? ' · <span style="color:#4CAF50;">✓ изучено</span>' : ''}
        </div>
        <div class="fc-scene">
            <div class="fc-card ${s.flipped ? 'flipped' : ''}" id="fc-card">
                <div class="fc-face fc-front">
                    <div class="fc-emoji">${w.emoji || '📘'}</div>
                      <div class="fc-word-en">${getDisplayEn(w.en)}</div>
                </div>
                <div class="fc-face fc-back">
                    <div class="fc-emoji">🇷🇺</div>
                    <div class="fc-word-ru">${w.ru}</div>
                </div>
            </div>
        </div>
        <div class="fc-controls">
            <button class="fc-btn" id="fc-prev" ${isFirst ? 'disabled' : ''} title="Назад">◀</button>
            <button class="fc-btn fc-speak" id="fc-speak" title="Озвучить">🔊</button>
            <button class="fc-btn fc-learn ${learned ? 'learned' : ''}" id="fc-learn"
                    title="${learned ? 'Уже изучено' : 'Отметить как изученное'}">
                ${learned ? '✓' : '☐'}
            </button>
            <button class="fc-btn fc-add ${inDict ? 'saved' : ''}" id="fc-add"
                    title="${inDict ? 'Уже в Моём словарике' : 'Добавить в Мой словарик'}">
                ${inDict ? '✓' : '➕'}
            </button>
            <button class="fc-btn" id="fc-next" ${isLast ? 'disabled' : ''} title="Вперёд">▶</button>
        </div>
    `;

    document.getElementById('fc-card').addEventListener('click', () => {
        s.flipped = !s.flipped;
        document.getElementById('fc-card').classList.toggle('flipped', s.flipped);
    });

    const prevBtn = document.getElementById('fc-prev');
    if (!isFirst) {
        prevBtn.addEventListener('click', () => {
            s.index--;
            s.flipped = false;
            renderFlashcard();
        });
    }

    const nextBtn = document.getElementById('fc-next');
    if (!isLast) {
        nextBtn.addEventListener('click', () => {
            s.index++;
            s.flipped = false;
            renderFlashcard();
        });
    }

    document.getElementById('fc-speak').addEventListener('click', () => {
        speakWord(w.en);
    });

    // Галочка "изучено"
    document.getElementById('fc-learn').addEventListener('click', () => {
        if (isLearned(w.en)) {
            unmarkLearned(w.en);
            renderFlashcard();
            return;
        }

        // Отмечаем как изученное
        markLearned(w.en);

        // Убираем это слово из текущей сессии
        s.words = s.words.filter(x => x.en !== w.en);

        // Если слов больше не осталось — перерисуем (покажется экран «Все изучены»)
        if (s.words.length === 0) {
            renderFlashcardsGame();
            return;
        }

        // Если убрали последнее слово в списке — сдвигаем индекс на одно назад
        if (s.index >= s.words.length) {
            s.index = s.words.length - 1;
        }
        s.flipped = false;
        renderFlashcard();
    });

    document.getElementById('fc-add').addEventListener('click', () => {
        if (isInMyDict(w.en)) {
            removeFromMyDict(w.en);
        } else {
            addToMyDict(w.en);
        }
        updateDictCounter();
        renderFlashcard();
    });    // Автоматическая озвучка при переходе на новую карточку
    setTimeout(() => speakWord(w.en), 150);
}

            return;
        }
        if (clean !== raw) {

    document.getElementById('hm-friend-start').addEventListener('click', tryStart);

}
function filterNounsOnly(words) {
    if (!words) return [];
    
    // 1. Категории, где вообще нет существительных
    const nonNounCats = [
        'numbers_basic', 'ordinal_numbers', 'basic_verbs', 'basic_adjectives',
        'adverbs', 'time_clock', 'phrasal_verbs', 'emotions', 'character',
        'appearance'
    ];
    const nonNounSet = new Set();
    nonNounCats.forEach(cat => {
        (wordsData[cat] || []).forEach(w => {
            nonNounSet.add(w.en.toLowerCase().trim());
        });
    });

    // 2. Функция проверки русского перевода (если перевод — глагол или прилагательное, отсеиваем)
    function isNonNounRu(ruText) {
        if (!ruText) return false;
        const words = ruText.toLowerCase().split(/[\s,;\/]+/);
        const verbEndings = ['ть', 'ться', 'тся', 'ет', 'ит', 'ал', 'ил', 'ла', 'ло', 'ли', 'ут', 'ют', 'ат', 'ят', 'ешь', 'ишь'];
        const adjEndings = ['ый', 'ий', 'ой', 'ая', 'яя', 'ое', 'ее', 'ые', 'ие', 'ого', 'ему', 'ым', 'им', 'ую', 'юю', 'ых', 'их'];
        for (let w of words) {
            w = w.trim();
            if (w.length < 4) continue;
            if (verbEndings.some(end => w.endsWith(end))) return true;
            if (adjEndings.some(end => w.endsWith(end))) return true;
        }
        return false;
    }

    // 3. Фильтруем слова
    return words.filter(w => {
        if (!w || !w.en) return false;
        const en = w.en.toLowerCase().trim();
        
        if (nonNounSet.has(en)) return false; // отсеиваем по категории
        if (en.startsWith('to ')) return false; // отсеиваем инфинитивы
        if (typeof numberValue === 'function' && numberValue(en) !== null) return false; // отсеиваем числа
        if (isNonNounRu(w.ru)) return false; // отсеиваем по русскому переводу
        
        return true;
    });
}

function hmPrepare(words, source) {
    const clean = (words || [])
        .map(w => {
            // Получаем загадку из нашего словаря RIDDLES_RU
            let riddle = typeof getRiddleForWord === 'function' ? getRiddleForWord(w) : '';
            
            // УМНЫЙ ФИЛЬТР: если загадка пустая, или это просто перевод, или это эмодзи (длина 1-2 символа) — убираем её
            if (riddle) {
                const r = riddle.toLowerCase().trim();
                const en = (w.en || '').toLowerCase().trim();
                const ru = (w.ru || '').toLowerCase().trim();
                if (r === en || r === ru || r.length < 3) {
                    riddle = '';
                }
            }

            return {
                en: (w.en || '').toUpperCase(),
                ru: w.ru || '',
                emoji: w.emoji || '📘',
                riddle: riddle,
                categoryTitle: findHintForWord(w.en).title
            };
        })
        .filter(w => {
            const s = w.en.replace(/[^A-Z]/g, '');
            return s.length === w.en.length && s.length >= 3 && s.length <= 15;
        });
    return clean;
}
// Определяет «намёк» для слова: категорию, к которой оно относится
function findHintForWord(en) {
    const key = en.toLowerCase().trim();

    // Сначала ищем в «Базе»
    for (const cat of basicSubCategories) {
        const found = (wordsData[cat.id] || []).find(w =>
            w.en.toLowerCase().trim() === key
        );
        if (found) return { title: cat.title };
    }

    // Потом в тематических категориях
    for (const cat of wordSubCategories) {
        const found = (wordsData[cat.id] || []).find(w =>
            w.en.toLowerCase().trim() === key
        );
        if (found) return { title: cat.title };
    }

    // Потом фразовые глаголы, если есть
    if (wordsData.phrasal_verbs) {
        const found = wordsData.phrasal_verbs.find(w =>
            w.en.toLowerCase().trim() === key
        );
        if (found) return { title: 'Фразовый глагол' };
    }

    // Если ничего не нашли — просто «Слово»
    return { title: 'Слово' };
}

function useHint() {
    const s = hmState;
    if (!s || s.isFriendMode) return;
    if (s.hintsUsed >= s.maxHints) return;

    // Собираем уникальные буквы слова, которые ещё не открыты
    const uniqueLetters = [...new Set(s.word.split(''))].filter(ch =>
        /[A-Z]/.test(ch) && !s.guessedLetters.has(ch)
    );

    if (uniqueLetters.length === 0) return;

    // Открываем одну случайную букву
    const letter = uniqueLetters[Math.floor(Math.random() * uniqueLetters.length)];
    s.guessedLetters.add(letter);
    s.hintsUsed++;

    renderHangmanBoard();
}


function handleHangmanGuess(letter) {
    const s = hmState;
    if (!s) return;

    if (s.word.includes(letter)) {
        s.guessedLetters.add(letter);
        speakWord(letter);
    } else {
        s.wrongLetters.add(letter);
    }

    renderHangmanBoard();

    // Проверяем победу/поражение
    const revealed = s.word.split('').every(ch =>
        !/[A-Z]/.test(ch) || s.guessedLetters.has(ch)
    );
    if (revealed) {
        speakWord(s.word);
    } else if (s.wrongLetters.size >= s.maxWrong) {
        // проиграли
    }
}

function bwShuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function renderBuildWordQuestion() {
    const s = bwState;
    const container = document.getElementById('bw-content');
    if (!container || !s) return;

    if (s.index >= s.total) {

        return;
    }

    const word = s.pool[s.index];
    s.currentWord = word;
    s.finished = false;

    // Разбиваем слово на буквы
    const letters = word.en.split('').map((ch, i) => ({
        id: i,
        letter: ch
    }));
    s.letters = letters;
    s.slots = new Array(letters.length).fill(null);

    const shuffled = bwShuffleArray(letters);

    container.innerHTML = `
        <div class="bw-container">
            <div class="bw-progress">Слово ${s.index + 1} из ${s.total} · ✓ ${s.score}</div>

            </div>

                ${shuffled.map(t => `
                    <button class="bw-letter" data-letter-id="${t.id}">${t.letter}</button>
                `).join('')}
            </div>
        </div>
    `;

    container.querySelectorAll('.bw-letter').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = parseInt(btn.dataset.letterId, 10);
            placeLetter(id);
        });
    });

      container.querySelectorAll('.bw-slot').forEach(slot => {
        slot.addEventListener('click', () => {
            const i = parseInt(slot.dataset.slotIndex, 10);
            removeFromSlot(i);
        });
    });

    // === Голосовой ввод: сказал слово → автозаполнение ===
    if (voiceAvailable()) {
        const bwContainer = container.querySelector('.bw-container');
        if (bwContainer) {
            attachVoiceButton(bwContainer, {
                lang: 'en-GB',
                validAnswers: [s.currentWord.en],
                onMatch: () => {
                    if (s.finished) return;
                    const target = s.currentWord.en.toUpperCase();
                    const newSlots = new Array(s.letters.length).fill(null);
                    const usedIds = new Set();

                    for (let i = 0; i < target.length && i < newSlots.length; i++) {
                        const letter = target[i];
                        const found = s.letters.find(l => !usedIds.has(l.id) && l.letter.toUpperCase() === letter);
                        if (found) {
                            usedIds.add(found.id);
                            newSlots[i] = found.id;
                        }
                    }
                    s.slots = newSlots;
                    updateBwUI();

                    const assembled = s.slots.map(id => id !== null ? s.letters[id].letter : '').join('');
                    if (assembled.toLowerCase() === s.currentWord.en.toLowerCase()) {
                        s.finished = true;
                        s.score++;
                        speakWord(s.currentWord.en);
                        const slotsEl = document.getElementById('bw-slots');
                        if (slotsEl) slotsEl.classList.add('correct');
                        setTimeout(() => {
                            s.index++;
                            renderBuildWordQuestion();
                        }, 900);
                    }
                }
            });
        }
    }
}

function placeLetter(letterId) {
    const s = bwState;
    if (!s || s.finished) return;

    // Проверяем, что буква ещё не использована
    if (s.slots.includes(letterId)) return;

    const emptyIndex = s.slots.indexOf(null);
    if (emptyIndex === -1) return;

    s.slots[emptyIndex] = letterId;
    updateBwUI();

    // Если всё заполнено — проверяем
    if (!s.slots.includes(null)) {
        const assembled = s.slots.map(id => s.letters[id].letter).join('');
        if (assembled.toLowerCase() === s.currentWord.en.toLowerCase()) {
            s.finished = true;
            s.score++;
            speakWord(s.currentWord.en);
            const slotsEl = document.getElementById('bw-slots');
            if (slotsEl) slotsEl.classList.add('correct');
            setTimeout(() => {
                s.index++;
                renderBuildWordQuestion();
            }, 900);
        } else {
            // Неправильно — трясём
            const slotsEl = document.getElementById('bw-slots');
            if (slotsEl) {
                slotsEl.classList.add('wrong');
                setTimeout(() => slotsEl.classList.remove('wrong'), 500);
            }
        }
    }
}

function removeFromSlot(slotIndex) {
    const s = bwState;
    if (!s || s.finished) return;
    s.slots[slotIndex] = null;
    updateBwUI();
}

function updateBwUI() {
    const s = bwState;
    const container = document.getElementById('bw-content');
    if (!container || !s) return;

    container.querySelectorAll('.bw-slot').forEach((slot, i) => {
        const id = s.slots[i];
        if (id === null) {
            slot.textContent = '';
            slot.classList.remove('filled');
        } else {
            slot.textContent = s.letters[id].letter;
            slot.classList.add('filled');
        }
    });

    container.querySelectorAll('.bw-letter').forEach(btn => {
        const id = parseInt(btn.dataset.letterId, 10);
        if (s.slots.includes(id)) {
            btn.classList.add('used');
            btn.disabled = true;
        } else {
            btn.classList.remove('used');
            btn.disabled = false;
        }
    });
}

function renderPpQuestion() {
    const s = ppState;
    const container = document.getElementById('pp-content');
    if (!container || !s) return;

    if (s.index >= s.total) {
        renderPpComplete();
        return;
    }

    const current = s.pool[s.index];
    // Разбиваем фразовый глагол на глагол + предлог (или несколько предлогов)
    // Например: "look after" → verb = "look", prep = "after"
    //           "put up with" → verb = "put", prep = "up with"
    const parts = current.en.split(' ');
    const verb = parts[0];
    const prep = parts.slice(1).join(' ');

    // Собираем варианты ответа
    const correctPrep = prep;

    // Берём правильный + 3 неправильных из PREPOSITION_CHOICES
    const wrongPool = PREPOSITION_CHOICES.filter(p => p.toLowerCase() !== correctPrep.toLowerCase());
    const shuffledWrong = [...wrongPool].sort(() => Math.random() - 0.5);
    const wrongOptions = shuffledWrong.slice(0, 3);

    const options = [
        { text: correctPrep, correct: true },
        ...wrongOptions.map(w => ({ text: w, correct: false }))
    ].sort(() => Math.random() - 0.5);

    s.currentOptions = options;
    s.answered = false;

    // Показываем глагол + подсказку
    const displayVerb = verb + ' ';

    container.innerHTML = `
        <div class="pp-container">
            <div class="pp-progress">
                Вопрос ${s.index + 1} из ${s.total}
                · <span class="pp-score">✓ ${s.score}</span>
            </div>

            <div class="pp-prompt-card">
                <div class="pp-prompt-emoji">${current.emoji || '🔗'}</div>
                <div class="pp-prompt-hint">${current.ru}</div>
                <div class="pp-prompt-verb">
                    ${displayVerb}
                    <span class="pp-blank">?</span>
                </div>
            </div>

            <div class="pp-options">
                ${options.map((opt, i) => `
                    <button class="pp-option" data-opt-index="${i}">${opt.text}</button>
                `).join('')}
            </div>
        </div>
    `;

    container.querySelectorAll('.pp-option').forEach(btn => {
        btn.addEventListener('click', () => {
            handlePpAnswer(parseInt(btn.dataset.optIndex, 10));
        });

let wordSearchState = null;

const WS_GRID_SIZE = 10;
const WS_WORDS_COUNT = 8;
// Множество известных английских слов (для проверки «реального» слова в филворде)
const knownEnglishWords = new Set();

// Только буквы A-Z, без пробелов и дефисов
function wsCleanWord(word) {
    return word.toUpperCase().replace(/[^A-Z]/g, '');
}

// Попытка разместить слово в сетке по горизонтали или вертикали
function wsTryPlace(grid, word, size) {
    const dirs = [
        { dr: 0, dc: 1 },   // →
        { dr: 1, dc: 0 }    // ↓
    ];
    // перемешиваем направления
    dirs.sort(() => Math.random() - 0.5);

    for (let attempt = 0; attempt < 200; attempt++) {
        const dir = dirs[Math.floor(Math.random() * dirs.length)];
        const maxRow = dir.dr === 0 ? size - 1 : size - word.length;
        const maxCol = dir.dc === 0 ? size - 1 : size - word.length;
        if (maxRow < 0 || maxCol < 0) continue;

        const row = Math.floor(Math.random() * (maxRow + 1));
        const col = Math.floor(Math.random() * (maxCol + 1));

        let fits = true;
        for (let i = 0; i < word.length; i++) {
            const r = row + dir.dr * i;
            const c = col + dir.dc * i;
            if (grid[r][c] && grid[r][c] !== word[i]) { fits = false; break; }
        }
        if (!fits) continue;

        for (let i = 0; i < word.length; i++) {
            const r = row + dir.dr * i;
            const c = col + dir.dc * i;
            grid[r][c] = word[i];
        }
        return { row, col, dr: dir.dr, dc: dir.dc };
    }
    return null;
}

function wsGenerate(words) {
    const size = WS_GRID_SIZE;
    const grid = Array.from({ length: size }, () => Array(size).fill(''));

    // Дедупликация: одно английское слово — один раз
    const seen = new Set();

    // Отбираем короткие слова (3–10 букв) — иначе не влезут
    const candidates = words
        .map(w => ({ ...w, clean: wsCleanWord(w.en) }))
        .filter(w => {
            if (w.clean.length < 3 || w.clean.length > size) return false;
            const key = w.en.toLowerCase().trim();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        })
        .sort(() => Math.random() - 0.5)
        .slice(0, WS_WORDS_COUNT);

    const placed = [];
    for (const w of candidates) {
        const pos = wsTryPlace(grid, w.clean, size);
        if (pos) {
            placed.push({
                en: w.en,
                clean: w.clean,
                ru: w.ru,
                emoji: w.emoji,
                row: pos.row,
                col: pos.col,
                dr: pos.dr,
                dc: pos.dc,
                found: false
            });
        }
    }

    // Заполняем пустые клетки случайными буквами
    const abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            if (!grid[r][c]) {
                grid[r][c] = abc[Math.floor(Math.random() * 26)];
            }
        }
    }

    return { grid, placed, size };
}

function renderWsGrid() {
    const s = wordSearchState;
    const gridEl = document.getElementById('ws-grid');
    gridEl.innerHTML = '';

    for (let r = 0; r < s.size; r++) {
        for (let c = 0; c < s.size; c++) {
            const cell = document.createElement('div');
            cell.className = 'ws-cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.textContent = s.grid[r][c];

            // Если клетка входит в найденное слово — отмечаем
            if (wsCellInFoundWord(r, c)) cell.classList.add('found');

            gridEl.appendChild(cell);
        }
    }
}

function wsCellInFoundWord(r, c) {
    const s = wordSearchState;
    return s.words.some(w => {
        if (!w.found) return false;
        for (let i = 0; i < w.clean.length; i++) {
            const rr = w.row + w.dr * i;
            const cc = w.col + w.dc * i;
            if (rr === r && cc === c) return true;
        }
        return false;
    });
}

function renderWsList() {
    const s = wordSearchState;
    const listEl = document.getElementById('ws-list');
    listEl.innerHTML = s.words.map((w, i) => `
        <div class="ws-word-item ${w.found ? 'found' : ''}" data-word-index="${i}">
            <span>${w.en}</span>
            <span style="font-size:0.85rem;opacity:0.8;">${w.found ? '✓' : ''}</span>
        </div>
    `).join('');
}

function attachWsEvents() {
    const gridEl = document.getElementById('ws-grid');
    const s = wordSearchState;

    // Определяем клетку по элементу или координатам события
    function getCell(target) {
        const el = target.closest ? target.closest('.ws-cell') : null;
        if (!el) return null;
        return { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c), el };
    }

    function clearHighlight() {
        s.currentCells.forEach(c => c.el.classList.remove('selected'));
        s.currentCells = [];
    }

    function highlightBetween(a, b) {
        clearHighlight();
        // Только горизонталь / вертикаль / диагональ
        const dr = b.r - a.r;
        const dc = b.c - a.c;
        const steps = Math.max(Math.abs(dr), Math.abs(dc));
        if (steps === 0) {
            const cell = document.querySelector(`.ws-cell[data-r="${a.r}"][data-c="${a.c}"]`);
            if (cell) { cell.classList.add('selected'); s.currentCells.push({ r: a.r, c: a.c, el: cell }); }
            return;
        }
        const stepR = dr === 0 ? 0 : dr / Math.abs(dr);
        const stepC = dc === 0 ? 0 : dc / Math.abs(dc);
        // должно быть по прямой линии
        if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return;

        for (let i = 0; i <= steps; i++) {
            const r = a.r + stepR * i;
            const c = a.c + stepC * i;
            const cell = document.querySelector(`.ws-cell[data-r="${r}"][data-c="${c}"]`);
            if (cell) {
                cell.classList.add('selected');
                s.currentCells.push({ r, c, el: cell });
            }
        }
    }

    // === Клик / drag на сетке ===
    function onDown(e) {
        const cell = getCell(e.target);
        if (!cell) return;
        e.preventDefault();
        s.startCell = cell;
        s.dragging = true;
        highlightBetween(cell, cell);
    }

    function onMove(e) {
        if (!s.dragging || !s.startCell) return;
        e.preventDefault();
        let target = e.target;
        // при touch — берём элемент под пальцем
        if (e.touches && e.touches.length) {
            const t = e.touches[0];
            target = document.elementFromPoint(t.clientX, t.clientY);
        }
        const cell = getCell(target);
        if (!cell) return;
        highlightBetween(s.startCell, cell);
    }

    function onUp(e) {
        if (!s.dragging) return;
        s.dragging = false;
        if (s.currentCells.length > 0) {
            checkWsSelection();
        }
        s.startCell = null;
    }

    gridEl.addEventListener('mousedown', onDown);
    gridEl.addEventListener('touchstart', onDown, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);

    // Чистим слушатели при выходе из игры
    s._cleanup = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchend', onUp);
    };
    // === Кнопка-подсказка "?" ===
    const hintBtn = document.getElementById('ws-hint');
    if (hintBtn) {
        hintBtn.addEventListener('click', showWsHint);
    }
}

function showWsHint() {
    const s = wordSearchState;
    if (!s) return;

    // Если подсказка ещё не закреплена или закреплённое слово уже найдено —
    // выбираем новое неразгаданное слово
    if (s.hintWordIndex === null || s.words[s.hintWordIndex].found) {
        const remainingIdx = s.words
            .map((w, i) => (!w.found ? i : -1))
            .filter(i => i !== -1);

        if (remainingIdx.length === 0) return; // всё найдено

        s.hintWordIndex = remainingIdx[Math.floor(Math.random() * remainingIdx.length)];
        s.hintLettersCount = 0;
    }

    const word = s.words[s.hintWordIndex];

    // Увеличиваем количество подсвеченных букв (не больше длины слова)
    if (s.hintLettersCount < word.clean.length) {
        s.hintLettersCount++;
    }

    // Снимаем старую подсветку подсказки
    document.querySelectorAll('.ws-cell.hint').forEach(c => c.classList.remove('hint'));

    // Подсвечиваем первые hintLettersCount букв выбранного слова
    for (let i = 0; i < s.hintLettersCount; i++) {
        const r = word.row + word.dr * i;
        const c = word.col + word.dc * i;
        const cell = document.querySelector(`.ws-cell[data-r="${r}"][data-c="${c}"]`);
        if (cell) {
            cell.classList.add('hint');
        }
    }

    // Прокручиваем к первой букве слова
    const firstCell = document.querySelector(`.ws-cell[data-r="${word.row}"][data-c="${word.col}"]`);
    if (firstCell) {
        firstCell.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
}
function checkWsSelection() {
    const s = wordSearchState;
    const cells = s.currentCells;
    if (cells.length < 2) {
        // если выделили одну букву — просто снимаем выделение
        cells.forEach(c => c.el.classList.remove('selected'));
        s.currentCells = [];
        return;
    }

    const selectedWord = cells.map(c => s.grid[c.r][c.c]).join('');
    const reversed = selectedWord.split('').reverse().join('');

    // Ищем слово в списке (по прямой, уже проверено highlightBetween)
    const match = s.words.find(w => !w.found && (w.clean === selectedWord || w.clean === reversed));

       if (match) {
        match.found = true;

        // Если подсказка была закреплена за этим словом — сбрасываем её
        if (s.hintWordIndex !== null && s.words[s.hintWordIndex] === match) {
            s.hintWordIndex = null;
            s.hintLettersCount = 0;
        }

        // Снимаем подсветку подсказки с клеток этого слова
        for (let i = 0; i < match.clean.length; i++) {
            const r = match.row + match.dr * i;
            const c = match.col + match.dc * i;
            const cell = document.querySelector(`.ws-cell[data-r="${r}"][data-c="${c}"]`);
            if (cell) cell.classList.remove('hint');
        }

        // красим клетки как найденные
        cells.forEach(c => {
            c.el.classList.remove('selected');
            c.el.classList.add('found');
        });
        speakWord(match.en);
        renderWsList();
        // проверяем, все ли слова найдены
        if (s.words.every(w => w.found)) {
            setTimeout(() => {
                const completeEl = document.getElementById('ws-complete');
                if (completeEl) {
                    completeEl.style.display = 'block';
                    completeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 500);
        }
    } else {
        // Проверяем, является ли выделенное слово реальным английским словом
        const cleanSelected = selectedWord.toLowerCase();
        const isRealWord = knownEnglishWords.has(cleanSelected) ||
                           knownEnglishWords.has(reversed.toLowerCase());

        if (isRealWord) {
            // Реальное слово, которого нет в списке — хвалим
            cells.forEach(c => {
                c.el.classList.remove('selected');
                c.el.classList.add('praise');
                setTimeout(() => c.el.classList.remove('praise'), 700);
            });
            showWsPraise();
        } else {
            // Бессмысленный набор букв — просто снимаем выделение
            cells.forEach(c => c.el.classList.remove('selected'));
        }
    }

    s.currentCells = [];
}

function showWsPraise() {
    const el = document.getElementById('ws-praise');
    if (!el) return;
    el.style.display = 'block';
    // перезапуск анимации
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'wsPraise 0.4s ease';

    el._timeout = setTimeout(() => {

}

const SHAPES_PROGRESS_KEY = 'goodStart_shapesProgress_v3';
const SHAPES_QUESTIONS_PER_ROUND = 10;
const SHAPES_PASS_RATIO = 0.7;

function loadShapesProgress() {
    try {
        const raw = localStorage.getItem(SHAPES_PROGRESS_KEY);
        const p = raw ? JSON.parse(raw) : null;
        if (p && typeof p === 'object') return p;
    } catch (e) {}
    return {};
}
function saveShapesProgress(p) {
    try { localStorage.setItem(SHAPES_PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}
function sgShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

let sgState = null;

// --- Точка входа: сразу нужный уровень ---
// --- Точка входа: всегда начинаем с 1-го уровня ---
function startShapesGame() {
    startShapesLevel(1, false);
}

// --- Запуск конкретного раунда ---
function startShapesLevel(levelNum, justUnlocked = false) {
    // Уровни 1–3 работают с фигурами, уровень 4 — с предметами
    const source = (levelNum === 4) ? SHAPES_L2_DATA : SHAPES_L1_DATA;
    const rounds = sgShuffle(source).slice(0, Math.min(SHAPES_QUESTIONS_PER_ROUND, source.length));

    // Добавляем флаг isRepeat, чтобы отличать вопросы, на которые уже была ошибка
    const roundsWithMeta = rounds.map(r => ({ ...r, isRepeat: false }));

    sgState = {
        level: levelNum,
        queue: [...roundsWithMeta], // Очередь вопросов
        totalUnique: rounds.length, // Всего уникальных вопросов в раунде
        correctFirstTry: 0,         // Счетчик правильных ответов с первой попытки
        answered: false,
        justUnlocked
    };
    renderShapesQuestion();
}
// --- Один вопрос ---
function renderShapesQuestion() {
    const s = sgState;
    if (!s) return;
    
    // Если очередь пуста — игра окончена
    if (s.queue.length === 0) { finishShapesLevel(); return; }

    s.answered = false;
    const item = s.queue[0]; // Берем первый вопрос из очереди

    let promptHtml = '';
    let correctAnswer = '';
    let questionTitle = '';
    let levelTitle = '';
    let isSvgOptions = false;

    if (s.level === 1) {
        isSvgOptions = true;
        promptHtml = `
            <div class="sg-audio-prompt">
                <button class="sg-play-btn" id="sg-play">🔊 Прослушать</button>
            </div>
        `;
        correctAnswer = item.en;
        questionTitle = 'Какая фигура прозвучала?';
        levelTitle = 'Слушай и выбирай';
    } else if (s.level === 2) {
        promptHtml = `<div class="sg-svg-prompt">${shapeSvg(item.svg)}</div>`;
        correctAnswer = item.en;
        questionTitle = 'Как называется эта фигура?';
        levelTitle = 'Какая это фигура?';
    } else if (s.level === 3) {
        isSvgOptions = true;
        promptHtml = `<div class="sg-word-prompt">${item.en}</div>`;
        correctAnswer = item.en;
        questionTitle = 'Выбери фигуру, которая соответствует слову';
        levelTitle = 'Прочитай и выбери';
    } else {
        promptHtml = `
            <div class="sg-emoji-prompt">${item.emoji}</div>
            <div class="sg-object-ru">${item.ru}</div>
        `;
        correctAnswer = item.shape;
        questionTitle = 'На какую фигуру похоже?';
        levelTitle = 'Форма вокруг нас';
    }

    const allShapeNames = SHAPES_L1_DATA.map(x => x.en);
    const wrongPool = allShapeNames.filter(n => n !== correctAnswer);
    const wrongs = sgShuffle(wrongPool).slice(0, 3);
    const options = sgShuffle([correctAnswer, ...wrongs]);

    let optionsHtml = '';
    if (isSvgOptions) {
        optionsHtml = options.map((opt, i) => {
            const sd = SHAPES_L1_DATA.find(x => x.en === opt);
            return `<button class="sg-option sg-option-svg" data-opt="${i}">${shapeSvg(sd.svg)}</button>`;
        }).join('');
    } else {
        optionsHtml = options.map((opt, i) => `<button class="sg-option" data-opt="${i}">${opt}</button>`).join('');
    }

    const showBanner = s.justUnlocked && s.queue.length === s.totalUnique;
    const mastered = s.totalUnique - s.queue.length; // Сколько уже выучено

    contentEl.innerHTML = `
        <div style="text-align:center;">
            <button class="games-back-btn" id="sg-level-back">← К играм</button>
        </div>
        ${showBanner ? `
            <div class="sg-unlock-banner" style="max-width:640px; margin: 0 auto 18px;">
                🎉 Уровень ${s.level - 1} пройден! Начинаем уровень ${s.level}: «${levelTitle}»
            </div>
        ` : ''}
        <div class="games-header">
            <h2>🔷 Уровень ${s.level} · ${levelTitle}</h2>
            <p>Освоено: ${mastered} из ${s.totalUnique} · ✓ ${s.correctFirstTry} (без ошибок)</p>
        </div>
        <div class="sg-container">
            <div class="sg-prompt-card">
                ${promptHtml}
                <div class="sg-question">${questionTitle}</div>
            </div>
            <div class="sg-options ${isSvgOptions ? 'sg-options-svg' : ''}">
                ${optionsHtml}
            </div>
        </div>
    `;

    // ВОЗВРАЩАЕМ АВТОЗАПУСК: озвучиваем при появлении вопроса и даем возможность переслушать
    if (s.level === 1) {
        const playFn = () => speakWord(correctAnswer);
        setTimeout(playFn, 300); // Небольшая задержка, чтобы браузер успел отрисовать экран
        document.getElementById('sg-play').addEventListener('click', playFn);
    }

    document.getElementById('sg-level-back').addEventListener('click', () => {
        if (s.correctFirstTry > 0) {
            if (!confirm('Выйти из игры? Прогресс раунда не сохранится.')) return;
        }
        if (currentGameAudience === 'adults') renderAdultsGameList();
        else renderKidsGameList();
    });

    document.querySelectorAll('.sg-option').forEach((btn, i) => {
        btn.addEventListener('click', () => {
            if (s.answered) return;
            s.answered = true;
            s.justUnlocked = false;

            const selected = options[i];
            const isCorrect = selected === correctAnswer;

            document.querySelectorAll('.sg-option').forEach((b, j) => {
                b.disabled = true;
                if (options[j] === correctAnswer) b.classList.add('correct');
                else if (j === i) b.classList.add('wrong');
            });

            if (isCorrect) {
                if (!item.isRepeat) s.correctFirstTry++; 
                // На 1 уровне не озвучиваем при клике, так как слово только что прозвучало автоматически
                if (s.level !== 1) speakWord(correctAnswer);
                
                s.queue.shift(); // Убираем вопрос из очереди
                setTimeout(() => { s.answered = false; renderShapesQuestion(); }, 850);
            } else {
                          
                item.isRepeat = true; // Запоминаем, что была ошибка
                speakWord(correctAnswer); // При ошибке всегда озвучиваем правильный ответ
                
                setTimeout(() => {
                    s.queue.shift(); // Убираем с начала
                    s.queue.push(item); // И ставим в конец очереди
                    s.answered = false;
                    renderShapesQuestion();
                }, 1400);
            }
        });
    });

    // === Голосовой ввод: только уровни 2 и 4 (ответ — название) ===
    if (voiceAvailable() && (s.level === 2 || s.level === 4)) {
        const sc = document.querySelector('.sg-container');
        if (sc) {
            attachVoiceButton(sc, {
                lang: 'en-GB',
                validAnswers: SHAPES_L1_DATA.map(x => x.en),
                onMatch: () => {
                    if (s.answered) return;
                    const idx = options.indexOf(correctAnswer);
                    const b = document.querySelector(`[data-opt="${idx}"]`);
                    if (b) b.click();
                }
            });
        }
    }
}

// ⬇⬇⬇ ВСТАВИТЬ СЮДА ВЕСЬ КОД ИГРЫ "ЦВЕТА" ⬇⬇⬇
const COLORS_DATA = [
    { en: 'red',    ru: 'красный',    hex: '#E53935' },
    { en: 'blue',   ru: 'синий',      hex: '#1E88E5' },
    { en: 'yellow', ru: 'жёлтый',     hex: '#FDD835' },
    { en: 'green',  ru: 'зелёный',    hex: '#43A047' },
    { en: 'orange', ru: 'оранжевый',  hex: '#FB8C00' },
    { en: 'purple', ru: 'фиолетовый', hex: '#8E24AA' },
    { en: 'pink',   ru: 'розовый',    hex: '#EC407A' },
    { en: 'brown',  ru: 'коричневый', hex: '#6D4C41' },
    { en: 'black',  ru: 'чёрный',     hex: '#212121' },
    { en: 'white',  ru: 'белый',      hex: '#FAFAFA' },
    { en: 'grey',   ru: 'серый',      hex: '#9E9E9E' },
    { en: 'gold',   ru: 'золотой',    hex: 'linear-gradient(135deg,#FFD700 0%,#FFA500 100%)' }
];

const COLORS_QUESTIONS_PER_LEVEL = 10;
const COLORS_PASS_RATIO = 0.7;

let colorsState = null;

function startColorsGame() {
    startColorsLevel(1);
}

function startColorsLevel(levelNum) {
    const shuffled = sgShuffle(COLORS_DATA)
        .slice(0, Math.min(COLORS_QUESTIONS_PER_LEVEL, COLORS_DATA.length));
    const queue = shuffled.map(c => ({ ...c, isRepeat: false }));

    colorsState = {
        level: levelNum,
        queue,
        totalUnique: queue.length,
        correctFirstTry: 0,
        answered: false
    };
    renderColorsQuestion();
}

function renderColorsQuestion() {
    const s = colorsState;
    if (!s) return;
    if (s.queue.length === 0) { finishColorsLevel(); return; }

    s.answered = false;
    const item = s.queue[0];

    let promptHtml = '';
    let questionTitle = '';
    let levelTitle = '';
    let optionsAreColors = false;

    if (s.level === 1) {
        // Уровень 1: слушаем и выбираем цвет
        promptHtml = `<div class="sg-audio-prompt">
            <button class="sg-play-btn" id="colors-play">🔊 Прослушать</button>
        </div>`;
        questionTitle = 'Какой цвет ты услышал?';
        levelTitle = 'Слушай и выбирай';
        optionsAreColors = true;
    } else if (s.level === 2) {
        // Уровень 2: видим слово → выбираем цвет
        const wordColor = ['#FAFAFA', '#FDD835'].includes(item.hex) ? '#2E7BAE' : item.hex;
        promptHtml = `<div class="sg-word-prompt" style="color:${wordColor}">${item.en}</div>`;
        questionTitle = 'Найди этот цвет';
        levelTitle = 'Найди цвет';
        optionsAreColors = true;
    } else {
        // Уровень 3: видим цвет → выбираем название
        promptHtml = `<div class="color-big-circle" style="background:${item.hex}"></div>`;
        questionTitle = 'Как называется этот цвет?';
        levelTitle = 'Назови цвет';
        optionsAreColors = false;
    }

    const correctAnswer = item.en;
    const allNames = COLORS_DATA.map(c => c.en);
    const wrongPool = allNames.filter(n => n !== correctAnswer);
    const wrongs = sgShuffle(wrongPool).slice(0, 3);
    const options = sgShuffle([correctAnswer, ...wrongs]);

    let optionsHtml = '';
    if (optionsAreColors) {
        optionsHtml = options.map((opt, i) => {
            const cd = COLORS_DATA.find(x => x.en === opt);
            const whiteCls = cd.hex === '#FAFAFA' ? ' is-white' : '';
            return `<button class="color-option-circle${whiteCls}" data-opt="${i}" style="background:${cd.hex}"></button>`;
        }).join('');
    } else {
        optionsHtml = options.map((opt, i) => {
            const cd = COLORS_DATA.find(x => x.en === opt);
            return `<button class="sg-option" data-opt="${i}">
                ${cd.en}
                <br><small style="font-weight:normal;color:#8A8A8A;font-size:0.85em;">${cd.ru}</small>
            </button>`;
        }).join('');
    }

    const mastered = s.totalUnique - s.queue.length;

    contentEl.innerHTML = `
        <div style="text-align:center;">
            <button class="games-back-btn" id="colors-back">← К играм</button>
        </div>
        <div class="games-header">
            <h2>🌈 Уровень ${s.level} · ${levelTitle}</h2>
            <p>Освоено: ${mastered} из ${s.totalUnique} · ✓ ${s.correctFirstTry}</p>
        </div>
        <div class="sg-container">
            <div class="sg-prompt-card">
                ${promptHtml}
                <div class="sg-question">${questionTitle}</div>
            </div>
            <div class="${optionsAreColors ? 'color-options-grid' : 'sg-options'}">
                ${optionsHtml}
            </div>
        </div>
        <style>
            .color-big-circle {
                width: 170px; height: 170px;
                border-radius: 50%;
                margin: 0 auto 14px;
                border: 5px solid #FFF;
                box-shadow: 0 8px 25px rgba(0,0,0,0.22),
                            inset 0 0 0 2px rgba(0,0,0,0.08);
            }
            .color-options-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                max-width: 360px;
                margin: 0 auto;
            }
            .color-option-circle {
                width: 100%;
                aspect-ratio: 1 / 1;
                max-height: 140px;
                border-radius: 20px;
                border: 5px solid #FFF;
                cursor: pointer;
                box-shadow: 0 6px 18px rgba(0,0,0,0.22),
                            inset 0 0 0 2px rgba(0,0,0,0.08);
                transition: all 0.2s;
            }
            .color-option-circle:hover:not(:disabled) {
                transform: translateY(-3px) scale(1.03);
                box-shadow: 0 10px 25px rgba(0,0,0,0.32),
                            inset 0 0 0 2px rgba(0,0,0,0.08);
            }
            .color-option-circle:disabled { cursor: default; }
            .color-option-circle.correct {
                border-color: #4CAF50;
                box-shadow: 0 0 0 4px #4CAF50, 0 6px 18px rgba(76,175,80,0.45);
                transform: scale(1.05);
            }
            .color-option-circle.wrong {
                border-color: #E53935;
                opacity: 0.5;
                animation: sgShake 0.5s ease;
            }
        </style>
    `;

    if (s.level === 1) {
        const playFn = () => speakWord(correctAnswer);
        setTimeout(playFn, 300);
        document.getElementById('colors-play').addEventListener('click', playFn);
    }

    document.getElementById('colors-back').addEventListener('click', () => {
        if (s.correctFirstTry > 0) {
            if (!confirm('Выйти из игры? Прогресс раунда не сохранится.')) return;
        }
        colorsState = null;
        renderKidsGameList();
    });

    const buttons = optionsAreColors
        ? document.querySelectorAll('.color-option-circle')
        : document.querySelectorAll('.sg-option');

    buttons.forEach((btn, i) => {
        btn.addEventListener('click', () => {
            if (s.answered) return;
            s.answered = true;

            const isCorrect = options[i] === correctAnswer;

            buttons.forEach((b, j) => {
                b.disabled = true;
                if (options[j] === correctAnswer) b.classList.add('correct');
                else if (j === i) b.classList.add('wrong');
            });

            if (isCorrect) {
                if (!item.isRepeat) s.correctFirstTry++;
                if (s.level !== 1) speakWord(correctAnswer);
                s.queue.shift();
                setTimeout(() => { s.answered = false; renderColorsQuestion(); }, 900);
              } else {
                item.isRepeat = true;
                speakWord(correctAnswer);
                setTimeout(() => {
                    s.queue.shift();
                    s.queue.push(item);
                    s.answered = false;
                    renderColorsQuestion();
                }, 1500);
            }
        });
    });

    // === Голосовой ввод: только уровень 3 (Назови цвет) ===
    if (voiceAvailable() && s.level === 3) {
        const sc = document.querySelector('.sg-container');
        if (sc) {
            attachVoiceButton(sc, {
                lang: 'en-GB',
                validAnswers: COLORS_DATA.map(c => c.en),
                onMatch: () => {
                    if (s.answered) return;
                    const idx = options.indexOf(correctAnswer);
                    const b = document.querySelector(`[data-opt="${idx}"]`);
                    if (b) b.click();
                }
            });
        }
    }
}
