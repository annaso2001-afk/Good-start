// ГОЛОСОВОЙ ВВОД (Web Speech API)
// ============================================================
const VOICE_KEY = 'goodStart_voiceEnabled';

const voiceSupport = {
    supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
    secure: (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
};

function loadVoiceEnabled() {
    const raw = localStorage.getItem(VOICE_KEY);
    return raw === null ? true : raw === '1';
}
function saveVoiceEnabled(v) { localStorage.setItem(VOICE_KEY, v ? '1' : '0'); }
let voiceEnabled = loadVoiceEnabled();

function voiceAvailable() {
    return voiceEnabled && voiceSupport.supported && voiceSupport.secure;
}

function normalizeVoiceText(text) {
    return String(text || '').toLowerCase().replace(/[.,!?;:'"«»…]/g, '').replace(/\s+/g, ' ').trim().replace(/^(a|an|the)\s+/i, '').replace(/\s+(a|an|the)$/i, '');
}

function voiceMatch(transcript, validAnswers) {
    const norm = normalizeVoiceText(transcript);
    if (!norm) return false;
    return validAnswers.some(ans => normalizeVoiceText(ans) === norm);
}

function showVoiceToast(message, isError) {
    const existing = document.getElementById('voice-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.id = 'voice-toast';
    toast.className = 'voice-toast' + (isError ? ' error' : '');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.remove(); }, 2500);
}

let activeVoiceSession = null;

function attachVoiceButton(container, opts) {
    if (!voiceAvailable() || !container) return null;

    const wrap = document.createElement('div');
    wrap.className = 'voice-btn-wrap';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'voice-btn';
    btn.innerHTML = '<span class="voice-icon">🎤</span><span class="voice-label">Держи и говори</span>';
    wrap.appendChild(btn);
    container.appendChild(wrap);

    const session = { active: false, btn, recognizer: null, startTime: 0, onUp: null };

    function finishPress() {
        if (!session.active) return;
        const elapsed = Date.now() - session.startTime;
        session.active = false;
        if (session.onUp) {
            document.removeEventListener('mouseup', session.onUp);
            document.removeEventListener('touchend', session.onUp);
            session.onUp = null;
        }
        if (activeVoiceSession === session) activeVoiceSession = null;

        if (elapsed < 300) {
            try { session.recognizer && session.recognizer.abort(); } catch (e) {}
            btn.classList.remove('listening');
            btn.querySelector('.voice-label').textContent = 'Держи и говори';
            return;
        }
        try { session.recognizer && session.recognizer.stop(); } catch (e) {}
    }

    function startPress(e) {
        if (e) e.preventDefault();
        if (!voiceSupport.supported || !voiceSupport.secure) return;
        if (!voiceEnabled) { showVoiceToast('Голосовой ввод отключён', false); return; }
        if (session.active) return;

        if (activeVoiceSession && activeVoiceSession !== session) {
            try { activeVoiceSession.recognizer && activeVoiceSession.recognizer.abort(); } catch (err) {}
        }
        activeVoiceSession = session;

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;

        const rec = new SpeechRec();
        rec.lang = opts.lang || 'en-GB';
        rec.continuous = false;
        rec.interimResults = false;
        rec.maxAlternatives = 3;

        rec.onresult = (event) => {
            const alternatives = [];
            for (let i = 0; i < event.results[0].length; i++) {
                alternatives.push(event.results[0][i].transcript);
            }
            const matched = alternatives.find(alt => voiceMatch(alt, opts.validAnswers || []));
            if (matched) {
                btn.classList.add('success');
                if (opts.onMatch) opts.onMatch(matched);
            } else {
                btn.classList.add('no-match');
                setTimeout(() => btn.classList.remove('no-match'), 800);
                if (opts.onNoMatch) opts.onNoMatch(alternatives[0] || '');
                else showVoiceToast('Не расслышал, попробуй ещё раз');
            }
        };

        rec.onerror = (event) => {
            const err = event.error;
            if (err === 'no-speech' || err === 'aborted') {
                if (err === 'no-speech') {
                    if (opts.onNoMatch) opts.onNoMatch('');
                    else showVoiceToast('Не расслышал, попробуй ещё раз');
                }
            } else if (err === 'not-allowed' || err === 'service-not-allowed') {
                showVoiceToast('Разреши микрофон в настройках браузера', true);
            } else if (opts.onError) {
                opts.onError(err);
            } else {
                showVoiceToast('Ошибка распознавания', true);
            }
        };

        rec.onend = () => {
            session.active = false;
            btn.classList.remove('listening');
            btn.querySelector('.voice-label').textContent = 'Держи и говори';
            setTimeout(() => btn.classList.remove('success'), 500);
            if (session.onUp) {
                document.removeEventListener('mouseup', session.onUp);
                document.removeEventListener('touchend', session.onUp);
                session.onUp = null;
            }
            if (activeVoiceSession === session) activeVoiceSession = null;
        };

        try { rec.start(); } catch (err) { session.active = false; showVoiceToast('Не удалось запустить микрофон', true); return; }

        session.recognizer = rec;
        session.active = true;
        session.startTime = Date.now();
        btn.classList.add('listening');
        btn.querySelector('.voice-label').textContent = 'Слушаю...';

        session.onUp = function() { finishPress(); };
        document.addEventListener('mouseup', session.onUp);
        document.addEventListener('touchend', session.onUp);
    }

    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('touchstart', startPress, { passive: false });
    btn.addEventListener('contextmenu', (e) => e.preventDefault());

    return btn;
}

(function initVoiceToggle() {
    const btn = document.getElementById('voice-toggle');
    if (!btn) return;
    if (!voiceSupport.supported || !voiceSupport.secure) { btn.classList.add('hidden'); return; }
    btn.classList.remove('hidden');

    function updateBtn() {
        btn.textContent = voiceEnabled ? '🎤' : '🚫';
        btn.classList.toggle('muted', !voiceEnabled);
        btn.title = voiceEnabled ? 'Голосовой ввод включён' : 'Голосовой ввод отключён';
    }
    updateBtn();

    btn.addEventListener('click', () => {
        voiceEnabled = !voiceEnabled;
        saveVoiceEnabled(voiceEnabled);
        updateBtn();
        showVoiceToast(voiceEnabled ? '🎤 Голос включён' : '🔇 Голос отключён');
    });
})();

// Запуск системы пользователей
// ============================================================
// УНИВЕРСАЛЬНОЕ ВЫДЕЛЕНИЕ СЛОВ + RU→EN ПЕРЕВОД
// ============================================================
function detectWordLang(word) {
    if (!word) return null;
    word = word.trim();
    if (!word) return null;
    if (/[\u0400-\u04FF]/.test(word)) return 'ru';
    if (/^[a-zA-Z'’\-]+$/.test(word)) return 'en';
    return null;
}

async function googleTranslateRuToEn(text) {
    const url1 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    try {
        const response = await fetch(url1);
        if (response.ok) {
            const data = await response.json();
            if (data && data[0] && Array.isArray(data[0])) {
                let translation = '';
                for (const part of data[0]) {
                    if (part && part[0]) translation += part[0];
                }
                translation = translation.trim();
                if (translation) return translation;
            }
        }
    } catch (e) {
        console.warn('RU→EN endpoint 1 failed:', e);
    }

    const url2 = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=ru&tl=en&q=${encodeURIComponent(text)}`;
    try {
        const response = await fetch(url2);
        if (response.ok) {
            const data = await response.json();
            let translation = '';
            if (Array.isArray(data)) {
                if (typeof data[0] === 'string') translation = data[0];
                else if (data[0] && data[0][0]) translation = data[0][0];
            }
            translation = translation.trim();
            if (translation) return translation;
        }
    } catch (e) {
        console.warn('RU→EN endpoint 2 failed:', e);
    }
    return null;
}

async function translateAnyWord(word) {
    const lang = detectWordLang(word);
    if (lang === 'en') {
        const t = await getTranslation(word);
        return { translation: t, lang: 'en', original: word };
    }
    if (lang === 'ru') {
        const cacheKey = 'translation_ru_en_' + word.toLowerCase();
        let t = localStorage.getItem(cacheKey);
        if (!t) {
            t = await googleTranslateRuToEn(word);
            if (!t) t = '—';
            localStorage.setItem(cacheKey, t);
        }
        return { translation: t, lang: 'ru', original: word };
    }
    return { translation: '—', lang: null, original: word };
}

// --- Расширенные функции словарика (поддержка RU-слов) ---
function isInMyDictExtended(word) {
    const w = word.toLowerCase().trim();
    return myDictionary.some(item => item.word.toLowerCase() === w);
}
function addToMyDictExtended(word, translation, lang) {
    const w = word.toLowerCase().trim();
    if (myDictionary.some(item => item.word.toLowerCase() === w)) return false;
    myDictionary.push({
        word: word,
        customTranslation: translation || '',
        lang: lang || 'en',
        addedAt: Date.now()
    });
    saveMyDict(myDictionary);
    updateDictCounter();
    return true;
}
function removeFromMyDictExtended(word) {
    const w = word.toLowerCase().trim();
    myDictionary = myDictionary.filter(item => item.word.toLowerCase() !== w);
    saveMyDict(myDictionary);
    updateDictCounter();
}

// --- Поп-ап ---
let globalWordPopup = null;
let globalPopupOutsideHandler = null;

function closeGlobalWordPopup() {
    if (globalWordPopup) {
        globalWordPopup.remove();
        globalWordPopup = null;
    }
    if (globalPopupOutsideHandler) {
        document.removeEventListener('click', globalPopupOutsideHandler);
        globalPopupOutsideHandler = null;
    }
}

async function showGlobalWordPopup(word, x, y) {
    closeGlobalWordPopup();

    const lang = detectWordLang(word);
    if (!lang) return;

    const popup = document.createElement('div');
    popup.className = 'global-word-popup';
    popup.id = 'global-word-popup';

    const langLabel = lang === 'ru' ? '🇷🇺 RU' : '🇬🇧 EN';
    const isSaved = isInMyDictExtended(word);

    popup.innerHTML = `
        <div class="gwp-word">
            <span>${word}</span>
            <span class="gwp-lang">${langLabel}</span>
        </div>
        <div class="gwp-translation loading" id="gwp-translation">⏳ перевод...</div>
        <div class="gwp-actions">
            <button id="gwp-speak" title="Озвучить (британский)">🔊</button>
            <button id="gwp-add" class="${isSaved ? 'saved' : ''}"
                    title="${isSaved ? 'Уже в Моём словарике' : 'Добавить в Мой словарик'}">
                ${isSaved ? '✅' : '➕'}
            </button>
            <button id="gwp-close" title="Закрыть">✕</button>
        </div>
    `;
    document.body.appendChild(popup);

    // Позиционирование с учётом границ экрана
    const pw = popup.offsetWidth;
    const ph = popup.offsetHeight;
    let px = x - pw / 2;
    let py = y + 12;
    if (px < 8) px = 8;
    if (px + pw > window.innerWidth - 8) px = window.innerWidth - pw - 8;
    if (py + ph > window.innerHeight - 8) py = y - ph - 20;
    popup.style.left = px + 'px';
    popup.style.top = py + 'px';

    globalWordPopup = popup;

    // Перевод
    const result = await translateAnyWord(word);
    const translationEl = document.getElementById('gwp-translation');
    if (translationEl && globalWordPopup === popup) {
        translationEl.textContent = result.translation;
        translationEl.classList.remove('loading');
    }

    // Озвучка английского слова
    document.getElementById('gwp-speak').addEventListener('click', (e) => {
        e.stopPropagation();
        const englishWord = lang === 'en' ? word : result.translation;
        if (englishWord && englishWord !== '—') speakWord(englishWord);
    });

    // Добавить/удалить
    document.getElementById('gwp-add').addEventListener('click', (e) => {
        e.stopPropagation();
        const btn = e.currentTarget;
        const translation = translationEl.textContent;
        if (isInMyDictExtended(word)) {
            removeFromMyDictExtended(word);
            btn.textContent = '➕';
            btn.classList.remove('saved');
            btn.title = 'Добавить в Мой словарик';
        } else {
            addToMyDictExtended(word, translation, lang);
            btn.textContent = '✅';
            btn.classList.add('saved');
            btn.title = 'Уже в Моём словарике';
        }
        renderSidebarList();
        updateSidebarTitle();
        updateDictCounter();
    });

    document.getElementById('gwp-close').addEventListener('click', (e) => {
        e.stopPropagation();
        closeGlobalWordPopup();
    });

    // Закрытие по клику мимо
    setTimeout(() => {
        if (globalPopupOutsideHandler) {
            document.removeEventListener('click', globalPopupOutsideHandler);
        }
        globalPopupOutsideHandler = function(e) {
            const p = document.getElementById('global-word-popup');
            if (p && !p.contains(e.target)) {
                closeGlobalWordPopup();
            }
        };
        document.addEventListener('click', globalPopupOutsideHandler);
    }, 0);
}

// --- Слушаем выделение текста мышкой ---
document.addEventListener('mouseup', (e) => {
    // Игнорируем клики в попапах / модалках / оверлеях / читалке книги
    if (e.target.closest('.global-word-popup')) return;
    if (e.target.closest('#word-popup')) return;
    if (e.target.closest('.book-text')) return;
    if (e.target.closest('.user-picker-overlay')) return;
    if (e.target.closest('.user-modal-bg')) return;
    if (e.target.closest('.sidebar')) return;

    setTimeout(() => {
        const sel = window.getSelection();
        if (!sel) { closeGlobalWordPopup(); return; }
        let text = sel.toString().trim();
        if (!text) { closeGlobalWordPopup(); return; }

        // Обрезаем знаки препинания по краям
        text = text.replace(/^[^\w\u0400-\u04FF'’\-]+|[^\w\u0400-\u04FF'’\-]+$/g, '');
        if (!text) { closeGlobalWordPopup(); return; }

        // Не более 3 слов / 40 символов
        if (text.split(/\s+/).length > 3 || text.length > 40) {
            closeGlobalWordPopup();
            return;
        }

        const lang = detectWordLang(text);
        if (!lang) { closeGlobalWordPopup(); return; }

        try {
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            showGlobalWordPopup(text, rect.left + rect.width / 2, rect.bottom);
        } catch (err) {
            // игнорируем ошибки range
        }
    }, 10);
});
